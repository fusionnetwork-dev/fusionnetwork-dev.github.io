<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@freemiu</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
 
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://swaqq.xyz/">
    <meta property="og:title" content="@freemiu">
    <meta property="og:description" content="i got swag">
    <meta property="og:image" content="assets/profile.png">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://swaqq.xyz/">
    <meta property="twitter:title" content="@freemiu">
    <meta property="twitter:description" content="i got swag">
    <meta property="twitter:image" content="assets/profile.png">
 
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @font-face {
            font-family: '1942';
            src: url('assets/1942.ttf') format('truetype');
        }
        body {
            font-family: '1942', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #333333, #c0c0c0, #888888, #ffffff, #666666);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        @keyframes gradient { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        
        video#bgVideo {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -2;
            opacity: 0.85;
            filter: brightness(1.4) contrast(1.4) saturate(1.3);
            pointer-events: none;
        }
        .welcome-screen {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }
        .welcome-screen.fade-out { opacity: 0; pointer-events: none; }
        .welcome-text {
            font-family: 'Courier New', monospace;
            font-size: 72px;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #333333, #c0c0c0, #888888, #ffffff, #666666);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: scrollGradient 3s linear infinite;
        }
        @keyframes scrollGradient { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        .container { perspective: 1000px; z-index: 1; }
        .card {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(20px);
            border: 3px solid transparent;
            border-radius: 24px;
            padding: 32px 40px 60px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            opacity: 0;
            position: relative;
            background-clip: padding-box;
        }
        .card.loaded { animation: fadeIn 0.6s ease forwards; }
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 3px;
            background: linear-gradient(90deg, #333333, #c0c0c0, #888888, #ffffff, #666666, #c0c0c0, #888888);
            background-size: 300% 100%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: borderScroll 4s linear infinite;
            pointer-events: none;
            z-index: -1;
        }
        @keyframes borderScroll { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
        @keyframes fadeIn { to { opacity: 1; } }
        
        .profile-header { display: flex; align-items: center; gap: 24px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .avatar-wrapper { position: relative; }
        .avatar {
            width: 90px; height: 90px;
            border-radius: 50%;
            background: url('https://cdn.discordapp.com/avatars/1084576683262230548/8aaa87fb465eebf94ee97739b3c108c2.webp?size=1024') center/cover no-repeat;
            border: 3px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
            transition: transform 0.3s ease;
            cursor: pointer;
            position: relative;
            z-index: 2;
        }
        .avatar:hover { transform: scale(1.08) rotate(5deg); }
        
        .lightning-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 130px;
            height: 130px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
        }
        
        .lightning-bolt {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 1px solid transparent;
            border-right: 1px solid transparent;
            opacity: 0;
        }
        
        .lightning-bolt::before,
        .lightning-bolt::after {
            content: '';
            position: absolute;
            width: 2px;
            background: linear-gradient(to bottom, 
                rgba(255, 0, 0, 0) 0%,
                rgba(255, 0, 0, 1) 20%,
                rgba(200, 0, 0, 1) 50%,
                rgba(150, 0, 0, 0.8) 80%,
                rgba(100, 0, 0, 0) 100%
            );
            box-shadow: 
                0 0 8px rgba(255, 0, 0, 1),
                0 0 15px rgba(255, 0, 0, 0.8),
                0 0 25px rgba(200, 0, 0, 0.6),
                inset 0 0 5px rgba(255, 255, 255, 0.5);
            filter: blur(0.5px);
        }
        
        .lightning-bolt::before {
            height: var(--bolt-height);
            left: -1px;
            transform: skewX(var(--skew-angle));
        }
        
        .lightning-bolt::after {
            height: calc(var(--bolt-height) * 0.6);
            left: 3px;
            top: calc(var(--bolt-height) * 0.3);
            transform: skewX(calc(var(--skew-angle) * -0.7));
            opacity: 0.7;
        }
        
        @keyframes blackFlash {
            0%, 100% { 
                opacity: 0;
            }
            2% { 
                opacity: 1;
                filter: brightness(1.5);
            }
            4% { 
                opacity: 0;
            }
            6% { 
                opacity: 0.9;
                filter: brightness(1.3);
            }
            8% { 
                opacity: 0;
            }
            10% { 
                opacity: 0.7;
            }
            12%, 100% { 
                opacity: 0;
            }
        }
        
        
        .user-info { flex: 1; }
        .uid {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 6px;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #333333, #c0c0c0, #888888, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #uidText {
            background: linear-gradient(90deg, #333333, #c0c0c0, #888888, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .username {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(90deg, #333333, #c0c0c0, #888888, #ffffff, #666666);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: scrollGradient 3s linear infinite;
            margin-bottom: 4px;
        }
        .handle { font-size: 14px; color: rgba(255,255,255,0.7); }
        .bio { 
            font-family: 'Courier New', monospace;
            color: rgba(255,255,255,0.9); 
            font-size: 15px; 
            line-height: 1.6; 
            margin-bottom: 18px; 
        }
        .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
        .badge {
            background: rgba(255,255,255,0.1);
            padding: 8px 14px;
            border-radius: 14px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
        }
        .badge span, .badge i {
            background: linear-gradient(90deg, #333333, #c0c0c0, #888888, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .social { display: flex; gap: 12px; margin-bottom: 20px; justify-content: center; }
        .social-icon { 
            width: 52px; 
            height: 52px; 
            background: rgba(255,255,255,0.1); 
            border: 1px solid rgba(255,255,255,0.2); 
            border-radius: 14px; 
            transition: all 0.3s ease; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .social-icon:hover { background: rgba(255,255,255,0.2); transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .social-icon img { width: 28px; height: 28px; }
        .version {
            position: absolute;
            bottom: 20px; left: 20px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            letter-spacing: 1px;
        }
        .view-counter {
            position: fixed;
            bottom: 24px; left: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px 18px;
            border-radius: 50px;
            z-index: 100;
            font-family: 'Courier New', monospace;
            color: white;
            font-size: 16px;
            font-weight: 600;
            opacity: 0;
        }
        .view-counter span {
            font-family: 'Courier New', monospace;
            font-weight: 600;
        }
        .view-counter.loaded { animation: fadeIn 0.6s ease forwards 0.2s; }
        .view-counter i { font-size: 18px; animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity: 0.7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }
        
        @media (max-width: 600px) {
            .card { padding: 32px 24px; }
            .profile-header { flex-direction: column; text-align: center; }
            .avatar { width: 100px; height: 100px; }
            .view-counter { bottom: 80px; left: 50%; transform: translateX(-50%); }
            .welcome-text { font-size: 48px; }
        }
    </style>
</head>
<body>
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-text" id="typewriter"></div>
    </div>
    <video id="bgVideo" loop playsinline autoplay>
        <source src="assets/mowmc.mp4" type="video/mp4">
    </video>
    <div class="container">
        <div class="card" id="card">
            <div class="profile-header">
                <div class="avatar-wrapper">
                    <div class="lightning-ring" id="lightningRing"></div>
                    <div class="avatar" id="avatar"></div>
                </div>
                <div class="user-info">
                    <div class="uid">UID <span id="uidText">0000</span></div>
                    <h1 class="username">miu</h1>
                    <p class="handle">@freemiu</p>
                </div>
            </div>
            <p class="bio" id="bio"></p>
            <div class="badges">
                <span class="badge"><i class="fas fa-crown"></i><span>Owner</span></span>
                <span class="badge"><i class="fas fa-code"></i><span>Developer</span></span>
                <span class="badge"><i class="fas fa-shield-alt"></i><span>Staff</span></span>
            </div>
            <div class="social">
                <a href="https://www.roblox.com/users/8156657037/profile" target="_blank" class="social-icon"><img src="assets/diamondspin.gif" alt="Roblox"></a>
                <a href="https://discord.com/users/1084576683262230548" target="_blank" class="social-icon"><img src="assets/gunspin.gif" alt="Discord"></a>
                <a href="https://www.youtube.com/@dsamiumiu" target="_blank" class="social-icon"><img src="assets/skimaskspin.gif" alt="YouTube"></a>
            </div>
            <div class="version">v4.2 @ freemiu</div>
        </div>
    </div>
    <div class="view-counter">
        <i class="fas fa-eye"></i>
        <span id="viewCount">0</span>
    </div>
    <script>
        // Black Flash style red lightning effect
        const lightningRing = document.getElementById('lightningRing');
        const numBolts = 6;
        
        function createBlackFlashBolt(index) {
            const bolt = document.createElement('div');
            bolt.className = 'lightning-bolt';
            
            // Position closer and tighter around the avatar
            const angle = (Math.random() * 360) * (Math.PI / 180);
            const distance = 50 + Math.random() * 15; // Much closer to avatar
            const x = 65 + Math.cos(angle) * distance;
            const y = 65 + Math.sin(angle) * distance;
            
            // Smaller, more compact bolts
            const height = 25 + Math.random() * 20;
            const skew = -15 + Math.random() * 30;
            
            bolt.style.left = x + 'px';
            bolt.style.top = y + 'px';
            bolt.style.setProperty('--bolt-height', height + 'px');
            bolt.style.setProperty('--skew-angle', skew + 'deg');
            bolt.style.animation = `blackFlash ${1.5 + Math.random() * 1.5}s infinite`;
            bolt.style.animationDelay = `${Math.random() * 2}s`;
            
            lightningRing.appendChild(bolt);
        }
        
        // Create initial lightning bolts
        for (let i = 0; i < numBolts; i++) {
            createBlackFlashBolt(i);
        }
        
        // Add occasional intense flash bursts
        setInterval(() => {
            const burstBolt = document.createElement('div');
            burstBolt.className = 'lightning-bolt';
            
            const angle = (Math.random() * 360) * (Math.PI / 180);
            const distance = 50 + Math.random() * 15;
            const x = 65 + Math.cos(angle) * distance;
            const y = 65 + Math.sin(angle) * distance;
            const height = 25 + Math.random() * 20;
            const skew = -15 + Math.random() * 30;
            
            burstBolt.style.left = x + 'px';
            burstBolt.style.top = y + 'px';
            burstBolt.style.setProperty('--bolt-height', height + 'px');
            burstBolt.style.setProperty('--skew-angle', skew + 'deg');
            burstBolt.style.animation = 'blackFlash 0.4s forwards';
            
            lightningRing.appendChild(burstBolt);
            
            setTimeout(() => burstBolt.remove(), 400);
        }, 2000);
        
        
        // View counter
        async function generateHWID() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.font = '14px Arial';
            ctx.fillText('fingerprint', 2, 2);
            const data = canvas.toDataURL();
            const fingerprint = { userAgent: navigator.userAgent, language: navigator.language, screen: `${screen.width}x${screen.height}`, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone, canvas: data };
            let hash = 0;
            const str = JSON.stringify(fingerprint);
            for (let i = 0; i < str.length; i++) { hash = ((hash << 5) - hash) + str.charCodeAt(i); hash |= 0; }
            return 'hwid_' + Math.abs(hash).toString(36);
        }
        async function initViewCounter() {
            const hwid = await generateHWID();
            const TOTAL_KEY = 'total_views';
            const HWID_KEY = hwid;
            let total = localStorage.getItem(TOTAL_KEY) ? parseInt(localStorage.getItem(TOTAL_KEY)) : 0;
            let hwidData = localStorage.getItem(HWID_KEY) ? JSON.parse(localStorage.getItem(HWID_KEY)) : {count: 0, date: new Date().toDateString()};
            if (hwidData.date !== new Date().toDateString()) hwidData = {count: 0, date: new Date().toDateString()};
            if (hwidData.count < 3) {
                total++; hwidData.count++;
                localStorage.setItem(TOTAL_KEY, total);
                localStorage.setItem(HWID_KEY, JSON.stringify(hwidData));
            }
            document.getElementById('viewCount').textContent = total.toLocaleString();
        }
        initViewCounter();

        // Typewriter welcome
        const welcomeText = "welcome";
        const typewriter = document.getElementById('typewriter');
        let i = 0;
        function typeWelcome() {
            if (i < welcomeText.length) {
                typewriter.textContent += welcomeText.charAt(i);
                i++;
                setTimeout(typeWelcome, 150);
            }
        }
        setTimeout(typeWelcome, 500);

        // Hide welcome + play video with audio
        const welcomeScreen = document.getElementById('welcomeScreen');
        const card = document.getElementById('card');
        const bgVideo = document.getElementById('bgVideo');
        function hideWelcome() {
            welcomeScreen.classList.add('fade-out');
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
                bgVideo.play();
                card.classList.add('loaded');
                document.querySelector('.view-counter').classList.add('loaded');
            }, 800);
        }
       
        welcomeScreen.addEventListener('click', hideWelcome);

        // Bio typing
        const bioElement = document.getElementById('bio');
        const bioText = "i got swag";
        let bioIndex = 0, isDeleting = false;
        function typeBio() {
            if (!isDeleting && bioIndex < bioText.length) {
                bioElement.textContent = bioText.substring(0, bioIndex + 1);
                bioIndex++;
                setTimeout(typeBio, 100);
            } else if (!isDeleting && bioIndex === bioText.length) {
                setTimeout(() => { isDeleting = true; typeBio(); }, 2000);
            } else if (isDeleting && bioIndex > 0) {
                bioElement.textContent = bioText.substring(0, bioIndex - 1);
                bioIndex--;
                setTimeout(typeBio, 50);
            } else if (isDeleting && bioIndex === 0) {
                isDeleting = false;
                setTimeout(typeBio, 500);
            }
        }
        setTimeout(typeBio, 1000);

        // Fast scrambling UID - 4 characters with hieroglyphics and symbols
        const uidText = document.getElementById('uidText');
        const chars = '0123456789ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛟ⚡☠✦✧⚔︎⚠︎◊◈△▽';
        function scramble() {
            let str = '';
            for (let j = 0; j < 4; j++) str += chars[Math.floor(Math.random() * chars.length)];
            uidText.textContent = str;
        }
        setInterval(scramble, 50);
        scramble();

        // Card tilt
        let targetX = 0, targetY = 0, currentX = 0, currentY = 0, isHovering = false;
        card.addEventListener('mouseenter', () => isHovering = true);
        card.addEventListener('mouseleave', () => { isHovering = false; targetX = targetY = 0; });
        card.addEventListener('mousemove', e => {
            if (!isHovering) return;
            const rect = card.getBoundingClientRect();
            targetX = (e.clientX - rect.left - rect.width / 2) / 10;
            targetY = (e.clientY - rect.top - rect.height / 2) / 10;
        });
        function animateCard() {
            currentX += (targetX - currentX) * 0.2;
            currentY += (targetY - currentY) * 0.2;
            card.style.transform = `perspective(1000px) rotateY(${currentX}deg) rotateX(${-currentY}deg)`;
            requestAnimationFrame(animateCard);
        }
        animateCard();

        // Avatar click
        document.getElementById('avatar').addEventListener('click', () => {
            const av = document.getElementById('avatar');
            av.style.transform = 'scale(1.15) rotate(360deg)';
            setTimeout(() => av.style.transform = '', 600);
        });
    </script>
</body>
</html>
