        @font-face {

        body {

        @keyframes gradient { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        
        /* Video Background - supports both YouTube and direct video */
        video#bgVideo {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -2;
            opacity: 0.85;
            filter: contrast(1.3) saturate(1.5);
            pointer-events: none;
        }
        
        #youtube-background {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%);
            z-index: -2;
            pointer-events: none;
            overflow: hidden;
        }
        
        #youtube-background::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.15);
            z-index: 1;
            pointer-events: none;
        }
        
        #youtube-background iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.77vh;
            transform: translate(-50%, -50%);

                #a0a0a0 55%,
                #c0c0c0 70%,

            background-clip: text;

            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);

        @keyframes borderScroll { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }

            50% { transform: translateY(-8px) scale(1.02); }

                6px 6px 25px rgba(0, 0, 0, 0.6);
            animation: yinYangGlow 3s ease-in-out infinite;
        }
        
        @keyframes yinYangGlow {
            0%, 100% {
                box-shadow: 
                    -4px -4px 15px rgba(255, 255, 255, 0.6),
                    4px 4px 15px rgba(0, 0, 0, 0.8),
                    -6px -6px 25px rgba(255, 255, 255, 0.4),
                    6px 6px 25px rgba(0, 0, 0, 0.6);
            }
            50% {
                box-shadow: 
                    4px 4px 15px rgba(255, 255, 255, 0.6),

                    6px 6px 25px rgba(255, 255, 255, 0.4),
                    -6px -6px 25px rgba(0, 0, 0, 0.6);
            }
        }
        
        .rain-container {
            position: absolute;
            top: -90px;
            left: 50%;
            transform: translateX(-50%);

            height: 220px;
            pointer-events: none;

        }

                transform: translateX(-50%) translateY(0);
            }

                transform: translateX(-50%) translateY(-8px);
            }
        }
        
        .cloud {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 45px;
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.7) 0%,
                rgba(200, 200, 200, 0.6) 25%,
                rgba(100, 100, 100, 0.5) 50%,
                rgba(50, 50, 50, 0.5) 75%,
                rgba(0, 0, 0, 0.6) 100%

            background-size: 200% 200%;
            border-radius: 70px 70px 60px 60px;
            filter: blur(8px) drop-shadow(0 10px 20px rgba(0, 0, 0, 0.15));
            opacity: 0.85;
            animation: yinYangCloudFlow 4s ease-in-out infinite;
        }
        
        @keyframes yinYangCloudFlow {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        
        .cloud::before {
            content: '';
            position: absolute;
            top: -22px;
            left: 18px;
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.75) 0%,
                rgba(150, 150, 150, 0.6) 50%,
                rgba(50, 50, 50, 0.65) 100%
            );
            background-size: 200% 200%;
            border-radius: 50%;
            filter: blur(6px);
            animation: yinYangCloudFlow 4s ease-in-out infinite;
        }
        
        .cloud::after {
            content: '';
            position: absolute;
            top: -16px;
            right: 22px;
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.7) 0%,
                rgba(180, 180, 180, 0.55) 50%,
                rgba(80, 80, 80, 0.6) 100%
            );
            background-size: 200% 200%;
            border-radius: 50%;
            filter: blur(5px);
            animation: yinYangCloudFlow 4s ease-in-out infinite;
        }
        
        .cloud-detail {
            position: absolute;
            bottom: -5px;
            left: 25%;
            width: 50%;
            height: 20px;
            background: linear-gradient(135deg,
                rgba(200, 200, 200, 0.4) 0%,
                rgba(120, 120, 120, 0.35) 50%,
                rgba(60, 60, 60, 0.4) 100%
            );
            background-size: 200% 200%;
            border-radius: 50%;
            filter: blur(6px);
            animation: yinYangCloudFlow 4s ease-in-out infinite;
        }
        
        .raindrop {
            position: absolute;
            width: 2px;
            height: 10px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            opacity: 0;
            filter: blur(0.15px);
            background: linear-gradient(to bottom, 
                var(--rain-color-1) 0%,
                var(--rain-color-2) 30%,
                var(--rain-color-3) 60%,
                var(--rain-color-4) 100%
            );
            box-shadow: 
                inset 0.5px 0.5px 0.5px var(--rain-highlight),
                inset -0.5px -0.5px 0.5px var(--rain-shadow),
                0 0 1px rgba(150, 150, 150, 0.15);
        }
        
        .raindrop::before {
            content: '';
            position: absolute;
            top: 15%;
            left: 35%;
            width: 40%;
            height: 30%;
            background: var(--rain-highlight);
            border-radius: 50%;
            filter: blur(0.3px);
        }
        
        @keyframes rainfall {
            0% {
                opacity: 0;
                transform: translateY(0);
                --rain-color-1: rgba(255, 255, 255, 0.15);
                --rain-color-2: rgba(200, 200, 200, 0.12);
                --rain-color-3: rgba(100, 100, 100, 0.09);
                --rain-color-4: rgba(0, 0, 0, 0.05);
                --rain-highlight: rgba(255, 255, 255, 0.3);
                --rain-shadow: rgba(0, 0, 0, 0.15);
            }
            2% {
                opacity: 1;
            }
            50% {
                --rain-color-1: rgba(0, 0, 0, 0.15);
                --rain-color-2: rgba(50, 50, 50, 0.12);
                --rain-color-3: rgba(150, 150, 150, 0.09);
                --rain-color-4: rgba(255, 255, 255, 0.05);
                --rain-highlight: rgba(0, 0, 0, 0.2);
                --rain-shadow: rgba(255, 255, 255, 0.15);
            }
            98% {
                opacity: 0.7;
                --rain-color-1: rgba(255, 255, 255, 0.15);
                --rain-color-2: rgba(200, 200, 200, 0.12);
                --rain-color-3: rgba(100, 100, 100, 0.09);
                --rain-color-4: rgba(0, 0, 0, 0.05);
                --rain-highlight: rgba(255, 255, 255, 0.3);
                --rain-shadow: rgba(0, 0, 0, 0.15);
            }
            100% {
                opacity: 0;
                transform: translateY(var(--fall-distance));
            }
        }
        
        .user-info { flex: 1; }
        .uid {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 6px;

        }
        .username {

        .status-indicator.online {

        .status-indicator.idle {

        .status-indicator.idle::before {

            content: '';
            position: absolute;
            top: 50%;

        }
        .bio {

        }
        .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
        .badge {

        .social { display: flex; gap: 12px; margin-bottom: 20px; justify-content: center; }

    <script>
        // ===================================
        // VIDEO CONFIGURATION
        // ===================================
        const USE_YOUTUBE = true; // Set to true for YouTube, false for direct video
        const YOUTUBE_VIDEO_ID = 'bc3fegosHek'; // Your YouTube video ID
        const DIRECT_VIDEO_URL = 'YOUR_VIDEO_URL.mp4'; // Your direct video URL (Catbox, Cloudflare Stream, etc.)
        
        // ===================================
        // GLOBAL VARIABLES
        // ===================================
        let player;
        let audioContext;
        let gainNode;
        let limiter;
        let analyser;
        let dataArray;
        let videoSource;
        let lastBeatTime = 0;
        let apiReady = false;
        const beatThreshold = 0.75;
        const beatCooldown = 250;
        
        // ===================================
        // YOUTUBE SETUP
        // ===================================
        if (USE_YOUTUBE) {
            var tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            var firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
            
            window.onYouTubeIframeAPIReady = function() {
                console.log('YouTube API Ready');
                apiReady = true;
            }
        }
        
        function initYouTubePlayer() {
            if (!apiReady) {
                setTimeout(initYouTubePlayer, 100);
                return;
            }
            
            player = new YT.Player('youtube-player', {
                videoId: YOUTUBE_VIDEO_ID,
                playerVars: {
                    autoplay: 1,
                    controls: 0,
                    disablekb: 1,
                    fs: 0,
                    modestbranding: 1,
                    playsinline: 1,
                    loop: 1,
                    playlist: YOUTUBE_VIDEO_ID,
                    mute: 0,
                    vq: 'hd2160', // Request 4K first, will fallback to highest available
                    iv_load_policy: 3,
                    cc_load_policy: 0,
                    showinfo: 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }
        
        function onPlayerReady(event) {
            console.log('YouTube Player ready - Auto-reset hack enabled');
            event.target.setVolume(80);
            
            // Get all available qualities and set to the highest one
            const availableQualities = player.getAvailableQualityLevels();
            console.log('Available qualities:', availableQualities);
            
            if (availableQualities.length > 0) {
                const highestQuality = availableQualities[0];
                player.setPlaybackQuality(highestQuality);
                console.log('Set quality to:', highestQuality);
                
                setTimeout(() => {
                    const currentQuality = player.getPlaybackQuality();
                    console.log('Current quality:', currentQuality);
                    if (currentQuality !== highestQuality) {
                        player.setPlaybackQuality(highestQuality);
                    }
                }, 2000);
            }
            
            // Monitor playback and reset BEFORE video ends to prevent end screen
            setInterval(() => {
                try {
                    const duration = player.getDuration();
                    const currentTime = player.getCurrentTime();
                    
                    // Reset to start 0.5 seconds before end to prevent end screen from ever loading
                    if (duration && currentTime && (duration - currentTime) < 0.5) {
                        player.seekTo(0);
                        // Immediately play again for seamless loop
                        setTimeout(() => {
                            player.playVideo();
                        }, 50);
                    }
                } catch (e) {
                    // Ignore errors
                }
            }, 100);
        }
        
        function onPlayerStateChange(event) {
            // AUTO-RESET HACK: Reset to thumbnail instead of showing end screen
            if (event.data === YT.PlayerState.ENDED) {
                // Seek to start and pause to show thumbnail (prevents end screen grid)
                event.target.seekTo(0);
                event.target.pauseVideo();
                
                // Auto-play again after a tiny delay for continuous loop
                setTimeout(() => {
                    event.target.playVideo();
                }, 100);
            } else if (event.data === YT.PlayerState.PAUSED) {
                // If somehow paused near the end, reset and continue
                try {
                    const duration = player.getDuration();
                    const currentTime = player.getCurrentTime();
                    
                    // Only auto-resume if paused near the end (not manual pause)
                    if (duration && currentTime && (duration - currentTime) < 1) {
                        event.target.seekTo(0);
                        setTimeout(() => {
                            event.target.playVideo();
                        }, 100);
                    }
                } catch (e) {
                    // Ignore errors
                }
            }
        }
        
        // ===================================
        // DIRECT VIDEO SETUP WITH BEAT DETECTION
        // ===================================
        function initDirectVideo() {
            const bgVideo = document.getElementById('bgVideo');
            const videoSource = document.getElementById('videoSource');
            
            videoSource.src = DIRECT_VIDEO_URL;
            bgVideo.style.display = 'block';
            bgVideo.load();
            
            // Log video quality info when metadata loads
            bgVideo.addEventListener('loadedmetadata', () => {
                console.log('Video loaded:');
                console.log('- Resolution:', bgVideo.videoWidth + 'x' + bgVideo.videoHeight);
                console.log('- Duration:', bgVideo.duration + 's');
                
                let qualityLabel = 'SD';
                if (bgVideo.videoHeight >= 2160) qualityLabel = '4K';
                else if (bgVideo.videoHeight >= 1440) qualityLabel = '1440p';
                else if (bgVideo.videoHeight >= 1080) qualityLabel = '1080p';
                else if (bgVideo.videoHeight >= 720) qualityLabel = '720p';
                else if (bgVideo.videoHeight >= 480) qualityLabel = '480p';
                
                console.log('- Quality:', qualityLabel);
            });
        }
        
        function setupAudio() {
            const bgVideo = document.getElementById('bgVideo');
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            videoSource = audioContext.createMediaElementSource(bgVideo);
            
            gainNode = audioContext.createGain();
            gainNode.gain.value = 0.8;
            
            limiter = audioContext.createDynamicsCompressor();
            limiter.threshold.value = -10;
            limiter.knee.value = 0;
            limiter.ratio.value = 20;
            limiter.attack.value = 0.003;
            limiter.release.value = 0.25;
            
            videoSource.connect(gainNode);
            gainNode.connect(limiter);
            limiter.connect(audioContext.destination);
        }
        
        function setupBeatDetection() {
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.3;
            const bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
            
            limiter.connect(analyser);
            
            detectBeat();
        }
        
        function detectBeat() {
            analyser.getByteFrequencyData(dataArray);
            
            // Focus on 808 range (20-200Hz)
            const bassSum = dataArray.slice(0, 15).reduce((a, b) => a + b, 0);
            const bassAvg = bassSum / 15 / 255;
            
            const now = Date.now();
            if (bassAvg > beatThreshold && now - lastBeatTime > beatCooldown) {
                lastBeatTime = now;
                triggerBeatBounce();
            }
            
            requestAnimationFrame(detectBeat);
        }
        
        function triggerBeatBounce() {
            const container = document.querySelector('.container');
            container.style.animation = 'none';
            void container.offsetWidth;
            container.style.animation = 'beatBounce 0.4s ease-out';
            setTimeout(() => {
                container.style.animation = '';
            }, 400);
        }
        
        // ===================================
        // RAIN EFFECT
        // ===================================
        function createRain() {
            const rainContainer = document.getElementById('rainContainer');
            const avatarRadius = 48;
            
            setInterval(() => {
                const drop = document.createElement('div');
                drop.className = 'raindrop';
                
                const startX = 25 + Math.random() * 50;
                drop.style.left = startX + '%';
                drop.style.top = '45px';
                
                const dropXPixel = (startX / 100) * 160 - 80;
                const profileCenterY = 135;
                
                let fallDistance = 160;
                let hitProfile = false;
                let currentY = 45;
                
                while (currentY < 200 && !hitProfile) {
                    currentY += 2;
                    const distanceFromCenter = Math.sqrt(
                        Math.pow(dropXPixel, 2) + 
                        Math.pow(currentY - profileCenterY, 2)
                    );
                    
                    if (distanceFromCenter <= avatarRadius + 1) {
                        fallDistance = currentY - 45;
                        hitProfile = true;
                        
                        setTimeout(() => {
                            const splash = document.createElement('div');
                            splash.style.position = 'absolute';
                            splash.style.left = drop.style.left;
                            splash.style.top = (45 + fallDistance) + 'px';
                            splash.style.width = '2px';
                            splash.style.height = '2px';
                            splash.style.background = 'radial-gradient(circle, rgba(255, 255, 255, 0.6), transparent)';
                            splash.style.borderRadius = '50%';
                            splash.style.animation = 'splash 0.15s ease-out forwards';
                            rainContainer.appendChild(splash);
                            setTimeout(() => splash.remove(), 150);
                        }, (fallDistance / 160) * 0.35 * 1000);
                        
                        break;
                    }
                }
                
                drop.style.setProperty('--fall-distance', fallDistance + 'px');
                const duration = 0.35 + Math.random() * 0.15;
                drop.style.animation = `rainfall ${duration}s linear forwards`;
                
                rainContainer.appendChild(drop);
                setTimeout(() => drop.remove(), duration * 1000);
            }, 40);
        }
        
        const style = document.createElement('style');
        style.textContent = `
            @keyframes splash {
                0% {
                    transform: scale(1);
                    opacity: 0.8;
                    background: radial-gradient(circle, rgba(255, 255, 255, 0.6), transparent);
                }
                50% {
                    background: radial-gradient(circle, rgba(100, 100, 100, 0.5), transparent);
                }
                100% {
                    transform: scale(2);
                    opacity: 0;
                    background: radial-gradient(circle, rgba(0, 0, 0, 0.3), transparent);
                }
            }
        `;
        document.head.appendChild(style);
        setTimeout(createRain, 1000);
        
        // ===================================
        // DISCORD STATUS
        // ===================================
        async function fetchDiscordStatus() {
            try {
                const response = await fetch('https://api.lanyard.rest/v1/users/1087346956973649951');
                if (!response.ok) throw new Error('API request failed');
                
                const data = await response.json();
                const statusText = document.getElementById('statusText');
                const statusIndicator = document.getElementById('statusIndicator');
                
                if (data.success && data.data) {
                    const user = data.data;
                    const status = user.discord_status;
                    const customStatus = user.activities?.find(a => a.type === 4);
                    
                    statusIndicator.className = 'status-indicator';
                    if (status === 'online') {
                        statusIndicator.classList.add('online');
                    } else if (status === 'idle') {
                        statusIndicator.classList.add('idle');
                    } else if (status === 'dnd') {
                        statusIndicator.classList.add('dnd');
                    } else {
                        statusIndicator.classList.add('offline');
                    }
                    
                    if (status === 'offline' || !customStatus || !customStatus.state) {
                        statusText.textContent = 'No status / Offline';
                    } else {
                        statusText.textContent = ` status : ${customStatus.state}`;
                    }
                } else {
                    statusText.textContent = 'No status / Offline';
                    statusIndicator.className = 'status-indicator offline';
                }
            } catch (error) {
                console.error('Failed to fetch Discord status:', error);
                document.getElementById('statusText').textContent = 'No status / Offline';
                document.getElementById('statusIndicator').className = 'status-indicator offline';
            }
        }
        
        fetchDiscordStatus();
        setInterval(fetchDiscordStatus, 30000);
        
        // ===================================
        // VIEW COUNTER
        // ===================================
        async function generateHWID() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.font = '14px Arial';
            ctx.fillText('fingerprint', 2, 2);
            const data = canvas.toDataURL();
            const fingerprint = { 
                userAgent: navigator.userAgent, 
                language: navigator.language, 
                screen: `${screen.width}x${screen.height}`, 
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone, 
                canvas: data 
            };
            let hash = 0;
            const str = JSON.stringify(fingerprint);
            for (let i = 0; i < str.length; i++) { 
                hash = ((hash << 5) - hash) + str.charCodeAt(i); 
                hash |= 0; 
            }
            return 'hwid_' + Math.abs(hash).toString(36);
        }
        
        async function initViewCounter() {
            const hwid = await generateHWID();
            const TOTAL_KEY = 'total_views';
            const HWID_KEY = hwid;
            let total = localStorage.getItem(TOTAL_KEY) ? parseInt(localStorage.getItem(TOTAL_KEY)) : 0;
            let hwidData = localStorage.getItem(HWID_KEY) ? JSON.parse(localStorage.getItem(HWID_KEY)) : {count: 0, date: new Date().toDateString()};
            if (hwidData.date !== new Date().toDateString()) hwidData = {count: 0, date: new Date().toDateString()};
            if (hwidData.count < 3) {
                total++; 
                hwidData.count++;
                localStorage.setItem(TOTAL_KEY, total);
                localStorage.setItem(HWID_KEY, JSON.stringify(hwidData));
            }
            document.getElementById('viewCount').textContent = total.toLocaleString();
        }
        initViewCounter();

        // ===================================
        // WELCOME SCREEN
        // ===================================
        const welcomeText = "wtwwwwwwww";
        const typewriter = document.getElementById('typewriter');
        let i = 0;
        function typeWelcome() {
            if (i < welcomeText.length) {
                typewriter.textContent += welcomeText.charAt(i);
                i++;
                setTimeout(typeWelcome, 120);
            }
        }
        setTimeout(typeWelcome, 300);

        const welcomeScreen = document.getElementById('welcomeScreen');
        const card = document.getElementById('card');
        
        function hideWelcome() {
            welcomeScreen.classList.add('fade-out');
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
                
                if (USE_YOUTUBE) {
                    const ytContainer = document.getElementById('youtube-background');
                    const iframe = document.createElement('div');
                    iframe.id = 'youtube-player';
                    ytContainer.appendChild(iframe);
                    initYouTubePlayer();
                } else {
                    initDirectVideo();
                    setupAudio();
                    const bgVideo = document.getElementById('bgVideo');
                    bgVideo.muted = false;
                    bgVideo.play().then(() => {
                        setupBeatDetection();
                        console.log('Beat detection active - Card will bounce to 808s!');
                    });
                }
                
                card.classList.add('loaded');
                document.querySelector('.view-counter').classList.add('loaded');
            }, 1000);
        }
       
        welcomeScreen.addEventListener('click', hideWelcome);

        // ===================================
        // BIO TYPING EFFECT
        // ===================================
        const bioElement = document.getElementById('bio');
        const bioText = "nttmstfu 😪";
        let bioIndex = 0, isDeleting = false;
        function typeBio() {
            if (!isDeleting && bioIndex < bioText.length) {
                bioElement.textContent = bioText.substring(0, bioIndex + 1);
                bioIndex++;
                setTimeout(typeBio, 100);
            } else if (!isDeleting && bioIndex === bioText.length) {
                setTimeout(() => { isDeleting = true; typeBio(); }, 2000);
            } else if (isDeleting && bioIndex > 0) {
                bioElement.textContent = bioText.substring(0, bioIndex - 1);
                bioIndex--;
                setTimeout(typeBio, 50);
            } else if (isDeleting && bioIndex === 0) {
                isDeleting = false;
                setTimeout(typeBio, 500);
            }
        }
        setTimeout(typeBio, 1000);

        // ===================================
        // UID SCRAMBLE
        // ===================================
        const uidText = document.getElementById('uidText');
        const chars = '0123456789ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛟ⚡☠✦✧⚔︎⚠︎◊◈△▽';
        function scramble() {
            let str = '';
            for (let j = 0; j < 4; j++) str += chars[Math.floor(Math.random() * chars.length)];
            uidText.textContent = str;
        }
        setInterval(scramble, 50);
        scramble();

        // ===================================
        // CARD TILT EFFECT
        // ===================================
        let targetX = 0, targetY = 0, currentX = 0, currentY = 0, isHovering = false;
        card.addEventListener('mouseenter', () => isHovering = true);
        card.addEventListener('mouseleave', () => { isHovering = false; targetX = targetY = 0; });
        card.addEventListener('mousemove', e => {
            if (!isHovering) return;
            const rect = card.getBoundingClientRect();
            targetX = (e.clientX - rect.left - rect.width / 2) / 10;
            targetY = (e.clientY - rect.top - rect.height / 2) / 10;
        });
        function animateCard() {
            currentX += (targetX - currentX) * 0.2;
            currentY += (targetY - currentY) * 0.2;
            card.style.transform = `perspective(1000px) rotateY(${currentX}deg) rotateX(${-currentY}deg)`;
            requestAnimationFrame(animateCard);
        }
        animateCard();

        // ===================================
        // AVATAR CLICK
        // ===================================
        document.getElementById('avatar').addEventListener('click', () => {
            const av = document.getElementById('avatar');
            av.style.transform = 'scale(1.15) rotate(360deg)';
            setTimeout(() => av.style.transform = '', 600);
        });
    </script>
</body>
</html>
