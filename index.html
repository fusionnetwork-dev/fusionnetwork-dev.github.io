<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @font-face {
            font-family: '1942';
            src: url('assets/1942.ttf') format('truetype');
        }
        body {
            font-family: '1942', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #333333, #c0c0c0, #888888, #ffffff, #666666);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        @keyframes gradient { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        
        video#bgVideo {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -2;
            opacity: 0.85;
            filter: brightness(1.4) contrast(1.4) saturate(1.3);
            pointer-events: none;
        }
        .welcome-screen {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }
        .welcome-screen.fade-out { opacity: 0; pointer-events: none; }
        .welcome-text {
            font-family: 'Courier New', monospace;
            font-size: 72px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 4px;
        }
        .container { perspective: 1000px; z-index: 1; }
        .card {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(20px);
            border: 3px solid transparent;
            border-radius: 24px;
            padding: 32px 40px 60px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            opacity: 0;
            position: relative;
            background-clip: padding-box;
        }
        .card.loaded { animation: fadeIn 0.6s ease forwards; }
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 3px;
            background: linear-gradient(90deg, #333333, #c0c0c0, #888888, #ffffff, #666666, #c0c0c0, #888888);
            background-size: 300% 100%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: borderScroll 4s linear infinite;
            pointer-events: none;
            z-index: -1;
        }
        @keyframes borderScroll { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
        @keyframes fadeIn { to { opacity: 1; } }
        
        .profile-header { display: flex; align-items: center; gap: 24px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .avatar-wrapper { position: relative; }
        .avatar {
            width: 90px; height: 90px;
            border-radius: 50%;
            background: url('assets/profile.png') center/cover no-repeat;
            border: 3px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
            transition: transform 0.3s ease;
            cursor: pointer;
            animation: shine 8s ease-in-out infinite;
        }
        @keyframes shine { 0%,100% { box-shadow: 0 0 0 rgba(255,255,255,0); } 50% { box-shadow: 0 0 30px rgba(255,255,255,0.8), 0 0 60px rgba(255,255,255,0.6); } }
        .avatar:hover { transform: scale(1.08) rotate(5deg); }
        .santa-hat {
            position: absolute;
            top: -35px; left: -45px;
            width: 100px; height: 100px;
            background: url('assets/santa_hat.png') center/contain no-repeat;
            pointer-events: none;
            transform: rotate(-20deg);
            z-index: 4;
        }
        .user-info { flex: 1; }
        .uid {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #333333, #c0c0c0, #888888, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #uidText {
            background: linear-gradient(90deg, #333333, #c0c0c0, #888888, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .username {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(90deg, #333333, #c0c0c0, #888888, #ffffff, #666666);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: scrollGradient 3s linear infinite;
            margin-bottom: 4px;
        }
        @keyframes scrollGradient { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        .handle { font-size: 14px; color: rgba(255,255,255,0.7); }
        .bio { 
            font-family: 'Courier New', monospace;
            color: rgba(255,255,255,0.9); 
            font-size: 15px; 
            line-height: 1.6; 
            margin-bottom: 18px; 
        }
        .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
        .badge {
            background: rgba(255,255,255,0.1);
            padding: 8px 14px;
            border-radius: 14px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
        }
        .badge span, .badge i {
            background: linear-gradient(90deg, #333333, #c0c0c0, #888888, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .social { display: flex; gap: 12px; margin-bottom: 20px; justify-content: center; }
        .social-icon { width: 52px; height: 52px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 14px; transition: all 0.3s ease; }
        .social-icon:hover { background: rgba(255,255,255,0.2); transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .social-icon img { width: 28px; height: 28px; }
        .version {
            position: absolute;
            bottom: 20px; left: 20px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            letter-spacing: 1px;
        }
        .view-counter {
            position: fixed;
            bottom: 24px; left: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px 18px;
            border-radius: 50px;
            z-index: 100;
            color: white;
            font-size: 16px;
            font-weight: 600;
            opacity: 0;
            font-family: 'Courier New', monospace;
        }
        .view-counter.loaded { animation: fadeIn 0.6s ease forwards 0.2s; }
        .view-counter i { font-size: 18px; animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity: 0.7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }
        
        .snow-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
        }
        .snowflake {
            position: absolute;
            color: #fff;
            font-size: 12px;
            opacity: 0.9;
            filter: blur(4px);
            pointer-events: none;
            user-select: none;
        }
        @media (max-width: 600px) {
            .card { padding: 32px 24px; }
            .profile-header { flex-direction: column; text-align: center; }
            .avatar { width: 100px; height: 100px; }
            .view-counter { bottom: 80px; left: 50%; transform: translateX(-50%); }
            .welcome-text { font-size: 48px; }
            .santa-hat { top: -45px; left: -55px; width: 120px; height: 120px; }
        }
    </style>
</head>
<body>
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-text" id="typewriter"></div>
    </div>
    <video id="bgVideo" loop playsinline autoplay muted>
        <source src="assets/getdat.mp4" type="video/mp4">
    </video>
    <div class="snow-container" id="snowContainer"></div>
    <div class="container">
        <div class="card" id="card">
            <div class="profile-header">
                <div class="avatar-wrapper">
                    <div class="avatar" id="avatar"></div>
                    <div class="santa-hat"></div>
                </div>
                <div class="user-info">
                    <div class="uid">UID: <span id="uidText">0000</span></div>
                    <h1 class="username">margi</h1>
                    <p class="handle">@districtmargi</p>
                </div>
            </div>
            <p class="bio" id="bio"></p>
            <div class="badges">
                <span class="badge"><i class="fas fa-crown"></i><span>Owner</span></span>
                <span class="badge"><i class="fas fa-code"></i><span>Developer</span></span>
                <span class="badge"><i class="fas fa-shield-alt"></i><span>Staff</span></span>
            </div>
            <div class="social">
                <a href="https://www.roblox.com/users/8156657037/profile" target="_blank" class="social-icon"><img src="assets/diamondspin.gif" alt="Roblox"></a>
                <a href="https://discord.com/users/1084576683262230548" target="_blank" class="social-icon"><img src="assets/gunspin.gif" alt="Discord"></a>
                <a href="https://www.youtube.com/@faintche" target="_blank" class="social-icon"><img src="assets/skimaskspin.gif" alt="YouTube"></a>
            </div>
            <div class="version">v4.1 @ margi</div>
        </div>
    </div>
    <div class="view-counter">
        <i class="fas fa-eye"></i>
        <span id="viewCount">0</span>
    </div>
    <script>
        // View counter
        async function generateHWID() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.font = '14px Arial';
            ctx.fillText('fingerprint', 2, 2);
            const data = canvas.toDataURL();
            const fingerprint = { userAgent: navigator.userAgent, language: navigator.language, screen: `${screen.width}x${screen.height}`, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone, canvas: data };
            let hash = 0;
            const str = JSON.stringify(fingerprint);
            for (let i = 0; i < str.length; i++) { hash = ((hash << 5) - hash) + str.charCodeAt(i); hash |= 0; }
            return 'hwid_' + Math.abs(hash).toString(36);
        }
        async function initViewCounter() {
            const hwid = await generateHWID();
            const TOTAL_KEY = 'total_views';
            const HWID_KEY = hwid;
            let total = localStorage.getItem(TOTAL_KEY) ? parseInt(localStorage.getItem(TOTAL_KEY)) : 0;
            let hwidData = localStorage.getItem(HWID_KEY) ? JSON.parse(localStorage.getItem(HWID_KEY)) : {count: 0, date: new Date().toDateString()};
            if (hwidData.date !== new Date().toDateString()) hwidData = {count: 0, date: new Date().toDateString()};
            if (hwidData.count < 3) {
                total++; hwidData.count++;
                localStorage.setItem(TOTAL_KEY, total);
                localStorage.setItem(HWID_KEY, JSON.stringify(hwidData));
            }
            document.getElementById('viewCount').textContent = total.toLocaleString();
        }
        initViewCounter();

        // Typewriter welcome
        const welcomeText = "welcome";
        const typewriter = document.getElementById('typewriter');
        let i = 0;
        function typeWelcome() {
            if (i < welcomeText.length) {
                typewriter.textContent += welcomeText.charAt(i);
                i++;
                setTimeout(typeWelcome, 150);
            }
        }
        setTimeout(typeWelcome, 500);

        // Hide welcome
        const welcomeScreen = document.getElementById('welcomeScreen');
        const card = document.getElementById('card');
        function hideWelcome() {
            welcomeScreen.classList.add('fade-out');
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
                document.getElementById('bgVideo').play();
                card.classList.add('loaded');
                document.querySelector('.view-counter').classList.add('loaded');
            }, 800);
        }
        setTimeout(hideWelcome, 4000);
        welcomeScreen.addEventListener('click', hideWelcome);

        // Bio typing
        const bioElement = document.getElementById('bio');
        const bioText = "i got swag";
        let bioIndex = 0, isDeleting = false;
        function typeBio() {
            if (!isDeleting && bioIndex < bioText.length) {
                bioElement.textContent = bioText.substring(0, bioIndex + 1);
                bioIndex++;
                setTimeout(typeBio, 100);
            } else if (!isDeleting && bioIndex === bioText.length) {
                setTimeout(() => { isDeleting = true; typeBio(); }, 2000);
            } else if (isDeleting && bioIndex > 0) {
                bioElement.textContent = bioText.substring(0, bioIndex - 1);
                bioIndex--;
                setTimeout(typeBio, 50);
            } else if (isDeleting && bioIndex === 0) {
                isDeleting = false;
                setTimeout(typeBio, 500);
            }
        }
        setTimeout(typeBio, 1000);

        // Fast scrambling UID - 4 characters
        const uidText = document.getElementById('uidText');
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        function scramble() {
            let str = '';
            for (let j = 0; j < 4; j++) str += chars[Math.floor(Math.random() * chars.length)];
            uidText.textContent = str;
        }
        setInterval(scramble, 50);
        scramble();

        // Snow with mouse wind, less snow, whiter/fuzzier, ground fade
        const snowContainer = document.getElementById('snowContainer');
        const flakes = [];
        let mouseX = 0;
        document.addEventListener('mousemove', e => { mouseX = e.clientX; });
        
        for (let i = 0; i < 80; i++) {
            const flake = document.createElement('div');
            flake.classList.add('snowflake');
            flake.textContent = '❄';
            flake.style.fontSize = `${Math.random() * 10 + 8}px`;
            flake.style.left = `${Math.random() * 100}vw`;
            flake.style.animationDuration = `${Math.random() * 8 + 8}s`;
            flake.style.animationDelay = `${Math.random() * 10}s`;
            snowContainer.appendChild(flake);
            flakes.push({
                el: flake,
                x: parseFloat(flake.style.left),
                baseSpeed: parseFloat(flake.style.animationDuration),
                offset: Math.random() * 100
            });
        }

        function animateSnow() {
            const wind = (mouseX / window.innerWidth - 0.5) * 20;
            flakes.forEach(f => {
                const progress = ((performance.now() / 1000 + f.offset) % f.baseSpeed) / f.baseSpeed;
                const y = progress * 120;
                f.el.style.transform = `translateX(${wind * progress}px) translateY(${y}vh)`;
                f.el.style.opacity = y > 90 ? 1 - (y - 90) / 10 : 0.9;
            });
            requestAnimationFrame(animateSnow);
        }
        animateSnow();

        // Card tilt
        let targetX = 0, targetY = 0, currentX = 0, currentY = 0, isHovering = false;
        card.addEventListener('mouseenter', () => isHovering = true);
        card.addEventListener('mouseleave', () => { isHovering = false; targetX = targetY = 0; });
        card.addEventListener('mousemove', e => {
            if (!isHovering) return;
            const rect = card.getBoundingClientRect();
            targetX = (e.clientX - rect.left - rect.width / 2) / 10;
            targetY = (e.clientY - rect.top - rect.height / 2) / 10;
        });
        function animateCard() {
            currentX += (targetX - currentX) * 0.2;
            currentY += (targetY - currentY) * 0.2;
            card.style.transform = `perspective(1000px) rotateY(${currentX}deg) rotateX(${-currentY}deg)`;
            requestAnimationFrame(animateCard);
        }
        animateCard();

        // Avatar click
        document.getElementById('avatar').addEventListener('click', () => {
            const av = document.getElementById('avatar');
            av.style.transform = 'scale(1.15) rotate(360deg)';
            setTimeout(() => av.style.transform = '', 600);
        });
    </script>
</body>
</html>
