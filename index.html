    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: '1942';
            src: url('assets/1942.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: '1942', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #8B0000, #C0C0C0, #FF0000, #E8E8E8);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            z-index: -2;
            opacity: 0.6;
            filter: brightness(0.8) contrast(1.1);
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            animation: scanline 8s linear infinite;
        }

        .scanlines::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0) 50%,
                rgba(0, 0, 0, 0.05) 51%,
                rgba(0, 0, 0, 0.05) 100%
            );
            animation: flicker 0.15s infinite;
        }

        @keyframes scanline {
            0% { transform: translateY(0); }
            100% { transform: translateY(10px); }
        }

        @keyframes flicker {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }

        .welcome-screen {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }

        .welcome-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .welcome-text {
            font-size: 72px;
            font-weight: 700;
            background: linear-gradient(90deg, #8B0000, #C0C0C0, #FF0000, #E8E8E8, #8B0000);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: scrollGradient 3s linear infinite;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .container {
            perspective: 1000px;
            z-index: 1;
        }

        .card {
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(15px);
            border: 3px solid transparent;
            border-radius: 24px;
            padding: 32px 40px;
            padding-bottom: 60px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            opacity: 0;
            position: relative;
            background-clip: padding-box;
        }
        
        .card.loaded {
            animation: fadeIn 0.6s ease forwards;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 3px;
            background: linear-gradient(90deg, #8B0000, #C0C0C0, #FF0000, #E8E8E8, #8B0000, #C0C0C0, #FF0000);
            background-size: 300% 100%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            animation: borderScroll 4s linear infinite;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes borderScroll {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .avatar-wrapper {
            position: relative;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: url('https://cdn.discordapp.com/avatars/1084576683262230548/3c6bb309bf6e6ab6cca8b18cea5a156e.webp?size=1024') center/cover;
            border: 3px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
            transition: transform 0.3s ease;
            cursor: pointer;
            position: relative;
            animation: shine 8s ease-in-out infinite;
        }

        @keyframes shine {

            }
            50% {
                box-shadow: 0 0 30px rgba(255, 255, 255, 0.8), 0 0 60px rgba(255, 255, 255, 0.6);
            }
        }

        .avatar:hover {
            transform: scale(1.08) rotate(5deg);
        }

        .avatar::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .avatar:hover::after {
            opacity: 1;

        }

        @keyframes sparkle {

        .badge:hover {

        .badge i {

            background: linear-gradient(90deg, #8B0000, #C0C0C0, #FF0000, #E8E8E8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;

        .social {

        .social-icon {

            position: fixed;
            bottom: 24px;
            left: 24px;
            display: flex;
            align-items: center;
            gap: 10px;

            z-index: 100;
            color: white;
            font-size: 16px;
            font-weight: 600;

            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 100;
            opacity: 0;
        }
        
        .settings-btn.loaded {
            animation: fadeIn 0.6s ease forwards 0.3s;
        }

        .volume-control {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 100;
            opacity: 0;
        }

        .volume-control.loaded {
            animation: fadeIn 0.6s ease forwards 0.3s;
        }

        .volume-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .volume-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .volume-btn.muted {
            background: rgba(139, 0, 0, 0.3);
            border-color: rgba(255, 0, 0, 0.4);
        }

        .volume-btn.muted:hover {
            background: rgba(139, 0, 0, 0.4);
        }

        .volume-slider-container {
            position: absolute;
            top: 70px;
            left: 0;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 16px 12px;
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .volume-control:hover .volume-slider-container {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }

        .volume-slider {
            writing-mode: bt-lr;
            -webkit-appearance: slider-vertical;
            width: 32px;
            height: 120px;
            background: transparent;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-runnable-track {
            width: 6px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: linear-gradient(135deg, #8B0000, #FF0000);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 4px 12px rgba(139, 0, 0, 0.5);
        }

        .volume-slider::-moz-range-track {
            width: 6px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .volume-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: linear-gradient(135deg, #8B0000, #FF0000);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }

        .volume-slider::-moz-range-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 4px 12px rgba(139, 0, 0, 0.5);
        }

        .settings-btn:hover {
            transform: scale(1.1) rotate(90deg);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 600px) {
            .card {
                padding: 32px 24px;
            }
            
            .profile-header {
                flex-direction: column;
                text-align: center;
            }

            .avatar {
                width: 100px;
                height: 100px;
            }

            .view-counter {
                bottom: 100px;
                left: 50%;
                transform: translateX(-50%);
            }

            .welcome-text {
                font-size: 48px;
            }
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>

        <div class="volume-btn" id="volumeBtn">

        </div>
        <div class="volume-slider-container">
            <input type="range" min="0" max="100" value="30" class="volume-slider" id="volumeSlider" orient="vertical">
        </div>
    </div>

    <div class="container">
        <div class="card" id="card">
            <div class="profile-header">
                <div class="avatar-wrapper">
                    <div class="avatar" id="avatar"></div>
                </div>
                <div class="user-info">
                    <div class="uid">UID 0</div>
                    <h1 class="username">margi</h1>
                    <p class="handle">@districtmargi</p>
                </div>
            </div>

            <p class="bio" id="bio"></p>

            <div class="badges">
                <span class="badge"><i class="fas fa-crown"></i><span>Owner</span></span>
                <span class="badge"><i class="fas fa-code"></i><span>Developer</span></span>

            <div class="social">

                    <img src="assets/diamondspin.gif" alt="Roblox">
                </a>
                <a href="https://discord.com/users/1084576683262230548" target="_blank" class="social-icon">

    <div class="view-counter">

    <div class="settings-btn" id="settingsBtn">
        <i class="fas fa-cog"></i>
    </div>

    <script>
        const card = document.getElementById('card');
        const avatar = document.getElementById('avatar');
        const bioElement = document.getElementById('bio');
        const viewCountElement = document.getElementById('viewCount');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const bgVideo = document.getElementById('bgVideo');
        const volumeBtn = document.getElementById('volumeBtn');
        const volumeIcon = document.getElementById('volumeIcon');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeControl = document.getElementById('volumeControl');

        bgVideo.volume = 0.3;

        volumeSlider.addEventListener('input', (e) => {
            const volume = e.target.value / 100;
            bgVideo.volume = volume;
            
            if (volume === 0) {
                volumeBtn.classList.add('muted');
                volumeIcon.className = 'fas fa-volume-mute';
            } else {
                volumeBtn.classList.remove('muted');
                if (volume < 0.5) {
                    volumeIcon.className = 'fas fa-volume-down';
                } else {
                    volumeIcon.className = 'fas fa-volume-up';
                }
            }
        });

        volumeBtn.addEventListener('click', () => {
            if (bgVideo.muted || bgVideo.volume === 0) {
                bgVideo.muted = false;
                bgVideo.volume = volumeSlider.value / 100 || 0.3;
                volumeSlider.value = bgVideo.volume * 100;
                volumeBtn.classList.remove('muted');
                volumeIcon.className = bgVideo.volume < 0.5 ? 'fas fa-volume-down' : 'fas fa-volume-up';
            } else {
                bgVideo.muted = true;
                volumeBtn.classList.add('muted');
                volumeIcon.className = 'fas fa-volume-mute';
            }
        });

        function hideWelcome() {
            welcomeScreen.classList.add('fade-out');
            bgVideo.muted = false;
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
                card.classList.add('loaded');
                viewCountElement.parentElement.classList.add('loaded');
                document.getElementById('settingsBtn').classList.add('loaded');
                volumeControl.classList.add('loaded');
            }, 800);
        }

        setTimeout(hideWelcome, 3000);

        welcomeScreen.addEventListener('click', hideWelcome);

        async function generateHWID() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.textBaseline = 'top';
            ctx.font = '14px Arial';
            ctx.fillText('fingerprint', 2, 2);
            const canvasData = canvas.toDataURL();
            
            const fingerprint = {
                userAgent: navigator.userAgent,
                language: navigator.language,
                screen: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                canvas: canvasData
            };
            
            const str = JSON.stringify(fingerprint);
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return 'hwid_' + Math.abs(hash).toString(36);
        }

        async function initViewCounter() {
            try {
                const hwid = await generateHWID();
                const VIEWS_KEY = 'profile_views';
                const HWID_KEY = hwid;
            
                let totalViews = 0;
                try {
                    const result = await window.storage.get(VIEWS_KEY, true);
                    totalViews = result ? parseInt(result.value) : 0;
                } catch (error) {
                    totalViews = 0;
                }
                
                let hwidData = { count: 0, lastReset: Date.now() };
                try {
                    const result = await window.storage.get(HWID_KEY, false);
                    if (result) {
                        hwidData = JSON.parse(result.value);
                    }
                } catch (error) {
                    hwidData = { count: 0, lastReset: Date.now() };
                }
                
                const twelveHours = 12 * 60 * 60 * 1000;
                if (Date.now() - hwidData.lastReset > twelveHours) {
                    hwidData.count = 0;
                    hwidData.lastReset = Date.now();
                }
                
                if (hwidData.count < 3) {
                    totalViews++;
                    hwidData.count++;
                    
                    await window.storage.set(VIEWS_KEY, totalViews.toString(), true);
                    await window.storage.set(HWID_KEY, JSON.stringify(hwidData), false);
                }
                
                animateCounter(totalViews);
                
            } catch (error) {
                console.error('View counter error:', error);
                viewCountElement.textContent = '74';
            }
        }

        function animateCounter(target) {
            let current = 0;
            const duration = 1500;
            const increment = target / (duration / 16);
            
            function update() {
                current += increment;
                if (current < target) {
                    viewCountElement.textContent = Math.floor(current).toLocaleString();
                    requestAnimationFrame(update);
                } else {
                    viewCountElement.textContent = target.toLocaleString();
                }
            }
            
            update();
        }

        initViewCounter();

        const bioText = "i got swag";
        let bioIndex = 0;
        let isDeleting = false;

        function typeBio() {
            if (!isDeleting && bioIndex < bioText.length) {
                bioElement.textContent = bioText.substring(0, bioIndex + 1);
                bioIndex++;
                setTimeout(typeBio, 100);
            } else if (!isDeleting && bioIndex === bioText.length) {
                setTimeout(() => {
                    isDeleting = true;
                    typeBio();
                }, 2000);
            } else if (isDeleting && bioIndex > 0) {
                bioElement.textContent = bioText.substring(0, bioIndex - 1);
                bioIndex--;
                setTimeout(typeBio, 50);
            } else if (isDeleting && bioIndex === 0) {
                isDeleting = false;
                setTimeout(typeBio, 500);
            }
        }

        setTimeout(typeBio, 800);

        let targetX = 0, targetY = 0;
        let currentX = 0, currentY = 0;
        let isHovering = false;
        
        card.addEventListener('mouseenter', () => {
            isHovering = true;
        });

        card.addEventListener('mouseleave', () => {
            isHovering = false;
            targetX = 0;
            targetY = 0;
        });

        card.addEventListener('mousemove', (e) => {
            if (!isHovering) return;
            
            const rect = card.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            targetX = (e.clientX - centerX) / 10;
            targetY = (e.clientY - centerY) / 10;
        });

        function animate() {
            currentX += (targetX - currentX) * 0.2;
            currentY += (targetY - currentY) * 0.2;
            
            card.style.transform = `
                perspective(1000px) 
                rotateY(${currentX}deg) 
                rotateX(${-currentY}deg)
            `;
            
            requestAnimationFrame(animate);
        }
        animate();

        avatar.addEventListener('click', () => {
            avatar.style.transform = 'scale(1.15) rotate(360deg)';
            setTimeout(() => avatar.style.transform = '', 600);
        });

        document.getElementById('settingsBtn').addEventListener('click', () => {
            alert('Settings under revamp');
        });

        let title = "@districtmargi";
        let i = 0;
        let forward = true;
        
        setInterval(() => {
            if (forward) {
                document.title = title.substring(0, i);
                i++;
                if (i > title.length) forward = false;
            } else {
                document.title = title.substring(0, i);
                i--;
                if (i < 0) forward = true;
            }
        }, 150);
    </script>
