    <script>

        const USE_YOUTUBE = true;

        let player;

        let apiReady = false;

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            const timeStr = `${String(hours).padStart(2, '0')}:${minutes}:${seconds} ${ampm}`;
            document.getElementById('lastUpdated').textContent = `Last Updated : ${timeStr}`;

        updateClock();

            window.onYouTubeIframeAPIReady = function() { apiReady = true; }
        }
        
        function initYouTubePlayer() {
            if (!apiReady) { setTimeout(initYouTubePlayer, 100); return; }
            player = new YT.Player('youtube-player', {
                videoId: YOUTUBE_VIDEO_ID,
                playerVars: {
                    autoplay: 1, controls: 0, disablekb: 1, fs: 0,
                    modestbranding: 1, playsinline: 1, loop: 1,
                    playlist: YOUTUBE_VIDEO_ID, mute: 0, vq: 'hd2160',
                    iv_load_policy: 3, cc_load_policy: 0, showinfo: 0
                },
                events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange }
            });
        }
        
        function onPlayerReady(event) {
            event.target.setVolume(80);
            const availableQualities = player.getAvailableQualityLevels();
            if (availableQualities.length > 0) {
                const highestQuality = availableQualities[0];
                player.setPlaybackQuality(highestQuality);
                setTimeout(() => {
                    if (player.getPlaybackQuality() !== highestQuality) player.setPlaybackQuality(highestQuality);
                }, 2000);
            }
            setInterval(() => {
                try {
                    const duration = player.getDuration();
                    const currentTime = player.getCurrentTime();
                    if (duration && currentTime && (duration - currentTime) < 0.5) {
                        player.seekTo(0);
                        setTimeout(() => player.playVideo(), 50);
                    }
                } catch (e) {}
            }, 100);
        }
        
        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                event.target.seekTo(0); event.target.pauseVideo();
                setTimeout(() => event.target.playVideo(), 100);
            } else if (event.data === YT.PlayerState.PAUSED) {
                try {
                    const duration = player.getDuration();
                    const currentTime = player.getCurrentTime();
                    if (duration && currentTime && (duration - currentTime) < 1) {
                        event.target.seekTo(0);
                        setTimeout(() => event.target.playVideo(), 100);
                    }
                } catch (e) {}
            }
        }
        function initDirectVideo() {
            const bgVideo = document.getElementById('bgVideo');
            document.getElementById('videoSource').src = DIRECT_VIDEO_URL;
            bgVideo.style.display = 'block';
            bgVideo.load();
        }
        
        function setupAudio() {
            const bgVideo = document.getElementById('bgVideo');
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            videoSource = audioContext.createMediaElementSource(bgVideo);
            gainNode = audioContext.createGain(); gainNode.gain.value = 0.8;
            limiter = audioContext.createDynamicsCompressor();
            limiter.threshold.value = -10; limiter.knee.value = 0; limiter.ratio.value = 20;
            limiter.attack.value = 0.003; limiter.release.value = 0.25;
            videoSource.connect(gainNode); gainNode.connect(limiter); limiter.connect(audioContext.destination);
        }
        
        function setupBeatDetection() {
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 512; analyser.smoothingTimeConstant = 0.3;
            const bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
            limiter.connect(analyser);
            detectBeat();
        }
        
        function detectBeat() {
            analyser.getByteFrequencyData(dataArray);
            const bassSum = dataArray.slice(0, 15).reduce((a, b) => a + b, 0);
            const bassAvg = bassSum / 15 / 255;
            const now = Date.now();
            if (bassAvg > beatThreshold && now - lastBeatTime > beatCooldown) {
                lastBeatTime = now;
                triggerBeatBounce();
            }
            requestAnimationFrame(detectBeat);
        }
        
        function triggerBeatBounce() {
            const container = document.querySelector('.container');
            container.style.animation = 'none';
            void container.offsetWidth;
            container.style.animation = 'beatBounce 0.4s ease-out';
            setTimeout(() => { container.style.animation = ''; }, 400);
        }
        async function fetchDiscordStatus() {
            try {
                const response = await fetch('https://api.lanyard.rest/v1/users/1087346956973649951');
                if (!response.ok) throw new Error('API request failed');
                const data = await response.json();
                const statusText = document.getElementById('statusText');
                const statusIndicator = document.getElementById('statusIndicator');
                if (data.success && data.data) {
                    const user = data.data;
                    const status = user.discord_status;
                    const customStatus = user.activities?.find(a => a.type === 4);
                    statusIndicator.className = 'status-indicator';
                    if (status === 'online') statusIndicator.classList.add('online');
                    else if (status === 'idle') statusIndicator.classList.add('idle');
                    else if (status === 'dnd') statusIndicator.classList.add('dnd');
                    else statusIndicator.classList.add('offline');
                    if (status === 'offline' || !customStatus || !customStatus.state) {
                        statusText.textContent = 'No status / Offline';
                    } else {
                        statusText.textContent = ` status : ${customStatus.state}`;
                    }
                } else {
                    statusText.textContent = 'No status / Offline';
                    statusIndicator.className = 'status-indicator offline';
                }
            } catch (error) {
                document.getElementById('statusText').textContent = 'No status / Offline';
                document.getElementById('statusIndicator').className = 'status-indicator offline';
            }
        }
        fetchDiscordStatus();
        setInterval(fetchDiscordStatus, 30000);
        async function generateHWID() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.font = '14px Arial';
            ctx.fillText('fingerprint', 2, 2);
            const data = canvas.toDataURL();
            const fingerprint = { 
                userAgent: navigator.userAgent, 
                language: navigator.language, 
                screen: `${screen.width}x${screen.height}`, 
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone, 
                canvas: data 
            };
            let hash = 0;
            const str = JSON.stringify(fingerprint);
            for (let i = 0; i < str.length; i++) { 
                hash = ((hash << 5) - hash) + str.charCodeAt(i); 
                hash |= 0; 
            }
            return 'hwid_' + Math.abs(hash).toString(36);
        }
        
        async function initViewCounter() {
            const hwid = await generateHWID();
            let total = localStorage.getItem('total_views') ? parseInt(localStorage.getItem('total_views')) : 0;
            let hwidData = localStorage.getItem(hwid) ? JSON.parse(localStorage.getItem(hwid)) : {count: 0, date: new Date().toDateString()};
            if (hwidData.date !== new Date().toDateString()) hwidData = {count: 0, date: new Date().toDateString()};
            if (hwidData.count < 3) {
                total++; hwidData.count++;
                localStorage.setItem('total_views', total);
                localStorage.setItem(hwid, JSON.stringify(hwidData));
            }
            document.getElementById('viewCount').textContent = total.toLocaleString();
        }
        initViewCounter();
        const welcomeText = "miu's abode";
        const typewriter = document.getElementById('typewriter');
        let i = 0;
        function typeWelcome() {
            if (i < welcomeText.length) {
                typewriter.textContent += welcomeText.charAt(i);
                i++;
                setTimeout(typeWelcome, 120);
            }
        }
        setTimeout(typeWelcome, 300);

        const welcomeScreen = document.getElementById('welcomeScreen');
        const card = document.getElementById('card');
        
        function hideWelcome() {
            welcomeScreen.classList.add('fade-out');
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
                if (USE_YOUTUBE) {
                    const ytContainer = document.getElementById('youtube-background');
                    const iframe = document.createElement('div');
                    iframe.id = 'youtube-player';
                    ytContainer.appendChild(iframe);
                    initYouTubePlayer();
                } else {
                    initDirectVideo();
                    setupAudio();
                    const bgVideo = document.getElementById('bgVideo');
                    bgVideo.muted = false;
                    bgVideo.play().then(() => setupBeatDetection());
                }
                card.classList.add('loaded');
                document.getElementById('viewCounter').classList.add('loaded');
            }, 1000);
        }
        welcomeScreen.addEventListener('click', hideWelcome);

        const bioElement = document.getElementById('bio');
        const bioText = "nttmstfu 😪";
        let bioIndex = 0, isDeleting = false;
        function typeBio() {
            if (!isDeleting && bioIndex < bioText.length) {
                bioElement.textContent = bioText.substring(0, bioIndex + 1);
                bioIndex++;
                setTimeout(typeBio, 100);
            } else if (!isDeleting && bioIndex === bioText.length) {
                setTimeout(() => { isDeleting = true; typeBio(); }, 2000);
            } else if (isDeleting && bioIndex > 0) {
                bioElement.textContent = bioText.substring(0, bioIndex - 1);
                bioIndex--;
                setTimeout(typeBio, 50);
            } else if (isDeleting && bioIndex === 0) {
                isDeleting = false;
                setTimeout(typeBio, 500);
            }
        }
        setTimeout(typeBio, 1000);
        const uidText = document.getElementById('uidText');
        const chars = '0123456789ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛟ⚡☠✦✧⚔︎⚠︎◊◈△▽';
        function scramble() {
            let str = '';
            for (let j = 0; j < 4; j++) str += chars[Math.floor(Math.random() * chars.length)];
            uidText.textContent = str;
        }
        setInterval(scramble, 50);
        scramble();
        let targetX = 0, targetY = 0, currentX = 0, currentY = 0, isHovering = false;
        card.addEventListener('mouseenter', () => isHovering = true);
        card.addEventListener('mouseleave', () => { isHovering = false; targetX = targetY = 0; });
        card.addEventListener('mousemove', e => {
            if (!isHovering) return;
            const rect = card.getBoundingClientRect();
            targetX = (e.clientX - rect.left - rect.width / 2) / 10;
            targetY = (e.clientY - rect.top - rect.height / 2) / 10;
        });
        function animateCard() {
            currentX += (targetX - currentX) * 0.2;
            currentY += (targetY - currentY) * 0.2;
            card.style.transform = `perspective(1000px) rotateY(${currentX}deg) rotateX(${-currentY}deg)`;
            requestAnimationFrame(animateCard);
        }
        animateCard();
        document.getElementById('avatar').addEventListener('click', () => {
            const av = document.getElementById('avatar');
            av.style.transform = 'scale(1.15) rotate(360deg)';
            setTimeout(() => av.style.transform = '', 600);
        });
        const navModal = document.getElementById('navModal');
        const navModalLink = document.getElementById('navModalLink');
        let pendingUrl = '';

        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', e => {
                e.preventDefault();
                pendingUrl = link.getAttribute('data-href');
                navModalLink.textContent = pendingUrl;
                navModal.classList.add('active');
            });
        });

        document.getElementById('navYes').addEventListener('click', () => {
            navModal.classList.remove('active');
            if (pendingUrl) window.open(pendingUrl, '_blank');
            pendingUrl = '';
        });

        document.getElementById('navNo').addEventListener('click', () => {
            navModal.classList.remove('active');
            pendingUrl = '';
        });

        navModal.addEventListener('click', e => {
            if (e.target === navModal) { navModal.classList.remove('active'); pendingUrl = ''; }
        });
    </script>
</body>
