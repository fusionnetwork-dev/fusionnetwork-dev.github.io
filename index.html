<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@districtmargi</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
  
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://swaqq.xyz/">
    <meta property="og:title" content="@districtmargi">
    <meta property="og:description" content="i got swag">
    <meta property="og:image" content="https://cdn.discordapp.com/avatars/1084576683262230548/a_.webp?size=1024">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://swaqq.xyz/">
    <meta property="twitter:title" content="@districtmargi">
    <meta property="twitter:description" content="i got swag">
    <meta property="twitter:image" content="https://cdn.discordapp.com/avatars/1084576683262230548/a_.webp?size=1024">
  
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        @font-face {
            font-family: '1942';
            src: url('assets/1942.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: '1942', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #333333, #c0c0c0, #888888, #ffffff, #666666);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        @keyframes gradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        iframe#bgVideo {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            z-index: -2;
            opacity: 0.4;
            filter: brightness(1.1) contrast(1.2);
            pointer-events: none;
        }
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            animation: scanline 8s linear infinite;
        }
        .scanlines::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0) 50%,
                rgba(0, 0, 0, 0.05) 51%,
                rgba(0, 0, 0, 0.05) 100%
            );
            animation: flicker 0.15s infinite;
        }
        @keyframes scanline {
            0% { transform: translateY(0); }
            100% { transform: translateY(10px); }
        }
        @keyframes flicker {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }
        .welcome-screen {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }
        .welcome-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        .welcome-text {
            font-size: 72px;
            font-weight: 700;
            background: linear-gradient(90deg, #333333, #c0c0c0, #888888, #ffffff, #666666);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: scrollGradient 3s linear infinite;
            letter-spacing: 4px;
        }
        .container {
            perspective: 1000px;
            z-index: 1;
        }
        .card {
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(15px);
            border: 3px solid transparent;
            border-radius: 24px;
            padding: 32px 40px;
            padding-bottom: 60px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            opacity: 0;
            position: relative;
            background-clip: padding-box;
        }
      
        .card.loaded {
            animation: fadeIn 0.6s ease forwards;
        }
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 3px;
            background: linear-gradient(90deg, #333333, #c0c0c0, #888888, #ffffff, #666666, #c0c0c0, #888888);
            background-size: 300% 100%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            animation: borderScroll 4s linear infinite;
            pointer-events: none;
            z-index: -1;
        }
        @keyframes borderScroll {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .avatar-wrapper {
            position: relative;
        }
        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: center/cover no-repeat;
            border: 3px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
            transition: transform 0.3s ease;
            cursor: pointer;
            position: relative;
            animation: shine 8s ease-in-out infinite;
        }
        @keyframes shine {
            0%, 100% {
                box-shadow: 0 0 0 rgba(255, 255, 255, 0);
            }
            50% {
                box-shadow: 0 0 30px rgba(255, 255, 255, 0.8), 0 0 60px rgba(255, 255, 255, 0.6);
            }
        }
        .avatar:hover {
            transform: scale(1.08) rotate(5deg);
        }
        .avatar::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .avatar:hover::after {
            opacity: 1;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .santa-hat {
            position: absolute;
            top: -30px;
            left: -20px;
            width: 100px;
            height: 100px;
            background: url('assets/santa_hat.png') center/contain no-repeat;
            pointer-events: none;
            transform: rotate(-20deg);
            z-index: 4;
        }
        .user-info {
            flex: 1;
        }
        .uid {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #333333, #c0c0c0, #888888, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Courier New', monospace;
        }
        .username {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(90deg, #333333, #c0c0c0, #888888, #ffffff, #666666);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: scrollGradient 3s linear infinite;
            margin-bottom: 4px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            position: relative;
            display: inline-block;
        }
        .username::before {
            content: 'diamond';
            position: absolute;
            left: -20px;
            top: 50%;
            transform: translateY(-50%);
            color: #000;
            font-size: 12px;
            animation: sparkle 2s ease-in-out infinite;
        }
        .username::after {
            content: 'diamond';
            position: absolute;
            right: -20px;
            top: 50%;
            transform: translateY(-50%);
            color: #000;
            font-size: 12px;
            animation: sparkle 2s ease-in-out infinite 1s;
        }
        @keyframes scrollGradient {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 200% 50%;
            }
        }
        @keyframes sparkle {
            0%, 100% {
                opacity: 0.3;
                transform: translateY(-50%) scale(0.8);
            }
            50% {
                opacity: 1;
                transform: translateY(-50%) scale(1.2);
            }
        }
        .handle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }
        .bio {
            color: rgba(255, 255, 255, 0.8);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 18px;
            min-height: 24px;
        }
        .bio::after {
            content: '|';
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }
        .badge {
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 14px;
            border-radius: 14px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
            user-select: none;
            -webkit-user-select: none;
        }
        .badge span {
            background: linear-gradient(90deg, #333333, #c0c0c0, #888888, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .badge:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .badge i {
            font-size: 11px;
            background: linear-gradient(90deg, #333333, #c0c0c0, #888888, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .social {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .social-icon {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .social-icon::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .social-icon:hover::before {
            opacity: 1;
        }
        .social-icon:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        .social-icon img {
            width: 28px;
            height: 28px;
            position: relative;
            z-index: 1;
        }
        .version {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Courier New', monospace;
            font-weight: 600;
            letter-spacing: 1px;
            user-select: none;
        }
        .view-counter {
            position: fixed;
            bottom: 24px;
            left: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 18px;
            border-radius: 50px;
            z-index: 100;
            color: white;
            font-size: 16px;
            font-weight: 600;
            opacity: 0;
        }
      
        .view-counter.loaded {
            animation: fadeIn 0.6s ease forwards 0.2s;
        }
        .view-counter i {
            font-size: 18px;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% {
                opacity: 0.7;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.1);
            }
        }
        .settings-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 100;
            opacity: 0;
        }
      
        .settings-btn.loaded {
            animation: fadeIn 0.6s ease forwards 0.3s;
        }

        /* Snow effect */
        .snow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
        }
        .snowflake {
            position: absolute;
            top: -10px;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            filter: blur(1.5px);
            animation: fall linear infinite;
            transition: opacity 0.5s ease;
        }
        @keyframes fall {
            0% {
                transform: translateY(-10px);
            }
            100% {
                transform: translateY(100vh);
            }
        }

        @media (max-width: 600px) {
            .card {
                padding: 32px 24px;
            }
            .profile-header {
                flex-direction: column;
                text-align: center;
            }
            .avatar {
                width: 100px;
                height: 100px;
            }
            .view-counter {
                bottom: 100px;
                left: 50%;
                transform: translateX(-50%);
            }
            .welcome-text {
                font-size: 48px;
            }
            .santa-hat {
                top: -35px;
                left: -25px;
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-text">welcome</div>
    </div>
    <iframe id="bgVideo" src="https://www.youtube.com/embed/CMEaHVCVW9o?autoplay=1&mute=1&loop=1&playlist=CMEaHVCVW9o&controls=0&modestbranding=1&rel=0&iv_load_policy=3&playsinline=1&enablejsapi=1" frameborder="0" allow="autoplay"></iframe>
    <div class="scanlines"></div>

    <div class="snow-container" id="snowContainer"></div>

    <div class="container">
        <div class="card" id="card">
            <div class="profile-header">
                <div class="avatar-wrapper">
                    <div class="avatar" id="avatar"></div>
                    <div class="santa-hat"></div>
                </div>
                <div class="user-info">
                    <div class="uid">UID 0</div>
                    <h1 class="username">margi</h1>
                    <p class="handle">@districtmargi</p>
                </div>
            </div>
            <p class="bio" id="bio"></p>
            <div class="badges">
                <span class="badge"><i class="fas fa-crown"></i><span>Owner</span></span>
                <span class="badge"><i class="fas fa-code"></i><span>Developer</span></span>
                <span class="badge"><i class="fas fa-shield-alt"></i><span>Staff</span></span>
            </div>
            <div class="social">
                <a href="https://www.roblox.com/users/8156657037/profile" target="_blank" class="social-icon">
                    <img src="assets/diamondspin.gif" alt="Roblox">
                </a>
                <a href="https://discord.com/users/1084576683262230548" target="_blank" class="social-icon">
                    <img src="assets/gunspin.gif" alt="Discord">
                </a>
                <a href="https://www.youtube.com/@faintche" target="_blank" class="social-icon">
                    <img src="assets/skimaskspin.gif" alt="YouTube">
                </a>
            </div>
            <div class="version">v4.0 @ margi</div>
        </div>
    </div>
    <div class="view-counter">
        <i class="fas fa-eye"></i>
        <span id="viewCount">Loading...</span>
    </div>
    <div class="settings-btn" id="settingsBtn">
        <i class="fas fa-cog"></i>
    </div>
    <script>
        const card = document.getElementById('card');
        const avatar = document.getElementById('avatar');
        const bioElement = document.getElementById('bio');
        const viewCountElement = document.getElementById('viewCount');
        const welcomeScreen = document.getElementById('welcomeScreen');

        // Dynamic Discord avatar
        const userId = '1084576683262230548';
        const avatarUrl = `https://cdn.discordapp.com/avatars/${userId}/a_.webp?size=256`;
        avatar.style.backgroundImage = `url('${avatarUrl}')`;

        // Real view counter (CountAPI)
        fetch('https://api.countapi.xyz/hit/swaqq.xyz/visits')
            .then(res => res.json())
            .then(data => {
                viewCountElement.textContent = data.value.toLocaleString();
            })
            .catch(() => {
                viewCountElement.textContent = '?';
            });

        // Snow effect
        const snowContainer = document.getElementById('snowContainer');
        for (let i = 0; i < 80; i++) {
            const flake = document.createElement('div');
            flake.classList.add('snowflake');
            const size = Math.random() * 6 + 4;
            flake.style.width = `${size}px`;
            flake.style.height = `${size}px`;
            flake.style.left = `${Math.random() * 100}vw`;
            flake.style.animationDuration = `${Math.random() * 10 + 10}s`;
            flake.style.animationDelay = `${Math.random() * 10}s`;
            flake.style.opacity = Math.random() * 0.4 + 0.5;
            snowContainer.appendChild(flake);
        }

        // Fade snowflakes near bottom
        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.boundingClientRect.top > window.innerHeight - 100) {
                    entry.target.style.opacity = '0';
                }
            });
        }, { rootMargin: '0px 0px -100px 0px' });

        document.querySelectorAll('.snowflake').forEach(flake => observer.observe(flake));

        function hideWelcome() {
            welcomeScreen.classList.add('fade-out');
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
                card.classList.add('loaded');
                viewCountElement.parentElement.classList.add('loaded');
                document.getElementById('settingsBtn').classList.add('loaded');
            }, 800);
        }
        setTimeout(hideWelcome, 3000);
        welcomeScreen.addEventListener('click', hideWelcome);

        const bioText = "i got swag";
        let bioIndex = 0;
        let isDeleting = false;
        function typeBio() {
            if (!isDeleting && bioIndex < bioText.length) {
                bioElement.textContent = bioText.substring(0, bioIndex + 1);
                bioIndex++;
                setTimeout(typeBio, 100);
            } else if (!isDeleting && bioIndex === bioText.length) {
                setTimeout(() => {
                    isDeleting = true;
                    typeBio();
                }, 2000);
            } else if (isDeleting && bioIndex > 0) {
                bioElement.textContent = bioText.substring(0, bioIndex - 1);
                bioIndex--;
                setTimeout(typeBio, 50);
            } else if (isDeleting && bioIndex === 0) {
                isDeleting = false;
                setTimeout(typeBio, 500);
            }
        }
        setTimeout(typeBio, 800);

        let targetX = 0, targetY = 0;
        let currentX = 0, currentY = 0;
        let isHovering = false;
      
        card.addEventListener('mouseenter', () => {
            isHovering = true;
        });
        card.addEventListener('mouseleave', () => {
            isHovering = false;
            targetX = 0;
            targetY = 0;
        });
        card.addEventListener('mousemove', (e) => {
            if (!isHovering) return;
          
            const rect = card.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
          
            targetX = (e.clientX - centerX) / 10;
            targetY = (e.clientY - centerY) / 10;
        });
        function animate() {
            currentX += (targetX - currentX) * 0.2;
            currentY += (targetY - currentY) * 0.2;
          
            card.style.transform = `
                perspective(1000px)
                rotateY(${currentX}deg)
                rotateX(${-currentY}deg)
            `;
          
            requestAnimationFrame(animate);
        }
        animate();

        avatar.addEventListener('click', () => {
            avatar.style.transform = 'scale(1.15) rotate(360deg)';
            setTimeout(() => avatar.style.transform = '', 600);
        });

        document.getElementById('settingsBtn').addEventListener('click', () => {
            alert('Settings under revamp');
        });

        let title = "@districtmargi";
        let i = 0;
        let forward = true;
      
        setInterval(() => {
            if (forward) {
                document.title = title.substring(0, i);
                i++;
                if (i > title.length) forward = false;
            } else {
                document.title = title.substring(0, i);
                i--;
                if (i < 0) forward = true;
            }
        }, 150);
    </script>
</body>
</html>
