<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@districtmargi</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
  
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://swaqq.xyz/">
    <meta property="og:title" content="@districtmargi">
    <meta property="og:description" content="i got swag">
    <meta property="og:image" content="assets/profile.png">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://swaqq.xyz/">
    <meta property="twitter:title" content="@districtmargi">
    <meta property="twitter:description" content="i got swag">
    <meta property="twitter:image" content="assets/profile.png">
  
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        @font-face {
            font-family: '1942';
            src: url('assets/1942.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: '1942', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #333333, #c0c0c0, #888888, #ffffff, #666666);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        @keyframes gradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        video#bgVideo {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            z-index: -2;
            opacity: 0.7;
            filter: brightness(1.2) contrast(1.3);
            pointer-events: none;
        }
        .welcome-screen {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }
        .welcome-screen.fade-out { opacity: 0; pointer-events: none; }
        .welcome-text {
            font-size: 72px;
            font-weight: 700;
            background: linear-gradient(90deg, #333333, #c0c0c0, #888888, #ffffff, #666666);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: scrollGradient 3s linear infinite;
            letter-spacing: 4px;
        }
        .container { perspective: 1000px; z-index: 1; }
        .card {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(20px);
            border: 3px solid transparent;
            border-radius: 24px;
            padding: 32px 40px 60px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            opacity: 0;
            position: relative;
            background-clip: padding-box;
        }
        .card.loaded { animation: fadeIn 0.6s ease forwards; }
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 3px;
            background: linear-gradient(90deg, #333333, #c0c0c0, #888888, #ffffff, #666666, #c0c0c0, #888888);
            background-size: 300% 100%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: borderScroll 4s linear infinite;
            pointer-events: none;
            z-index: -1;
        }
        @keyframes borderScroll { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
        @keyframes fadeIn { to { opacity: 1; } }
        .profile-header { display: flex; align-items: center; gap: 24px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .avatar-wrapper { position: relative; }
        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: url('assets/profile.png') center/cover no-repeat;
            border: 3px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
            transition: transform 0.3s ease;
            cursor: pointer;
            position: relative;
            animation: shine 8s ease-in-out infinite;
        }
        @keyframes shine { 0%,100% { box-shadow: 0 0 0 rgba(255,255,255,0); } 50% { box-shadow: 0 0 30px rgba(255,255,255,0.8), 0 0 60px rgba(255,255,255,0.6); } }
        .avatar:hover { transform: scale(1.08) rotate(5deg); }
        .avatar::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .avatar:hover::after { opacity: 1; animation: spin 2s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .santa-hat {
            position: absolute;
            top: -40px;
            left: -45px;
            width: 100px;
            height: 100px;
            background: url('assets/santa_hat.png') center/contain no-repeat;
            pointer-events: none;
            transform: rotate(-20deg);
            z-index: 4;
        }
        .user-info { flex: 1; }
        .uid {
            font-size: 11px;
            color: rgba(255,255,255,0.7);
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #333333, #c0c0c0, #888888, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Courier New', monospace;
        }
        .username {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(90deg, #333333, #c0c0c0, #888888, #ffffff, #666666);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: scrollGradient 3s linear infinite;
            margin-bottom: 4px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        @keyframes scrollGradient { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        .handle { font-size: 14px; color: rgba(255,255,255,0.7); }
        .bio {
            color: rgba(255,255,255,0.9);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 18px;
            min-height: 24px;
        }
        .bio::after { content: '|'; animation: blink 1s step-end infinite; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
        .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
        .badge {
            background: rgba(255,255,255,0.1);
            padding: 8px 14px;
            border-radius: 14px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.2s ease;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
        }
        .badge span {
            background: linear-gradient(90deg, #333333, #c0c0c0, #888888, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .badge:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }
        .badge i {
            font-size: 11px;
            background: linear-gradient(90deg, #333333, #c0c0c0, #888888, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .social { display: flex; gap: 12px; margin-bottom: 20px; justify-content: center; }
        .social-icon {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 14px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .social-icon:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .social-icon img { width: 28px; height: 28px; z-index: 1; }
        .version {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            font-family: 'Courier New', monospace;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .view-counter {
            position: fixed;
            bottom: 24px;
            left: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px 18px;
            border-radius: 50px;
            z-index: 100;
            color: white;
            font-size: 16px;
            font-weight: 600;
            opacity: 0;
        }
        .view-counter.loaded { animation: fadeIn 0.6s ease forwards 0.2s; }
        .view-counter i { font-size: 18px; animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity: 0.7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }
        .settings-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 100;
            opacity: 0;
        }
        .settings-btn.loaded { animation: fadeIn 0.6s ease forwards 0.3s; }
        .snow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }
        .snowflake {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            filter: blur(3px);
            animation: fall linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(100vh); }
        }
        @media (max-width: 600px) {
            .card { padding: 32px 24px; }
            .profile-header { flex-direction: column; text-align: center; }
            .avatar { width: 100px; height: 100px; }
            .view-counter { bottom: 100px; left: 50%; transform: translateX(-50%); }
            .welcome-text { font-size: 48px; }
            .santa-hat { top: -50px; left: -55px; width: 120px; height: 120px; }
        }
    </style>
</head>
<body>
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-text">welcome</div>
    </div>
    <video id="bgVideo" loop playsinline autoplay>
        <source src="assets/stopme.mp4" type="video/mp4">
    </video>

    <div class="snow-container" id="snowContainer"></div>

    <div class="container">
        <div class="card" id="card">
            <div class="profile-header">
                <div class="avatar-wrapper">
                    <div class="avatar" id="avatar"></div>
                    <div class="santa-hat"></div>
                </div>
                <div class="user-info">
                    <div class="uid">UID 0</div>
                    <h1 class="username">margi</h1>
                    <p class="handle">@districtmargi</p>
                </div>
            </div>
            <p class="bio" id="bio"></p>
            <div class="badges">
                <span class="badge"><i class="fas fa-crown"></i><span>Owner</span></span>
                <span class="badge"><i class="fas fa-code"></i><span>Developer</span></span>
                <span class="badge"><i class="fas fa-shield-alt"></i><span>Staff</span></span>
            </div>
            <div class="social">
                <a href="https://www.roblox.com/users/8156657037/profile" target="_blank" class="social-icon"><img src="assets/diamondspin.gif" alt="Roblox"></a>
                <a href="https://discord.com/users/1084576683262230548" target="_blank" class="social-icon"><img src="assets/gunspin.gif" alt="Discord"></a>
                <a href="https://www.youtube.com/@faintche" target="_blank" class="social-icon"><img src="assets/skimaskspin.gif" alt="YouTube"></a>
            </div>
            <div class="version">v4.0 @ margi</div>
        </div>
    </div>
    <div class="view-counter">
        <i class="fas fa-eye"></i>
        <span id="viewCount">0</span>
    </div>
    <div class="settings-btn" id="settingsBtn">
        <i class="fas fa-cog"></i>
    </div>
    <script>
        const card = document.getElementById('card');
        const bioElement = document.getElementById('bio');
        const viewCountElement = document.getElementById('viewCount');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const bgVideo = document.getElementById('bgVideo');

        // HWID-based view counter (max 3 per day per device)
        async function generateHWID() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.font = '14px Arial';
            ctx.fillText('fingerprint', 2, 2);
            const data = canvas.toDataURL();
            const fingerprint = {
                userAgent: navigator.userAgent,
                language: navigator.language,
                screen: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                canvas: data
            };
            let hash = 0;
            const str = JSON.stringify(fingerprint);
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0;
            }
            return 'hwid_' + Math.abs(hash).toString(36);
        }

        async function initViewCounter() {
            const hwid = await generateHWID();
            const TOTAL_KEY = 'total_views';
            const HWID_KEY = hwid;

            let total = localStorage.getItem(TOTAL_KEY) ? parseInt(localStorage.getItem(TOTAL_KEY)) : 0;

            let hwidData = localStorage.getItem(HWID_KEY) ? JSON.parse(localStorage.getItem(HWID_KEY)) : {count: 0, date: new Date().toDateString()};

            if (hwidData.date !== new Date().toDateString()) {
                hwidData = {count: 0, date: new Date().toDateString()};
            }

            if (hwidData.count < 3) {
                total++;
                hwidData.count++;
                localStorage.setItem(TOTAL_KEY, total);
                localStorage.setItem(HWID_KEY, JSON.stringify(hwidData));
            }

            viewCountElement.textContent = total.toLocaleString();
        }
        initViewCounter();

        // Infinite snow (200 small fast fuzzy flakes)
        const snowContainer = document.getElementById('snowContainer');
        function createSnow() {
            for (let i = 0; i < 200; i++) {
                const flake = document.createElement('div');
                flake.classList.add('snowflake');
                const size = Math.random() * 3 + 2; // 2-5px
                flake.style.width = `${size}px`;
                flake.style.height = `${size}px`;
                flake.style.left = `${Math.random() * 100}vw`;
                flake.style.animationDuration = `${Math.random() * 3 + 3}s`; // 3-6s fast
                flake.style.animationDelay = `${Math.random() * 5}s`;
                flake.style.opacity = Math.random() * 0.6 + 0.4;
                snowContainer.appendChild(flake);
            }
        }
        createSnow();

        function hideWelcome() {
            welcomeScreen.classList.add('fade-out');
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
                bgVideo.play().catch(() => {});
                card.classList.add('loaded');
                viewCountElement.parentElement.classList.add('loaded');
                document.getElementById('settingsBtn').classList.add('loaded');
            }, 800);
        }
        setTimeout(hideWelcome, 3000);
        welcomeScreen.addEventListener('click', hideWelcome);

        const bioText = "i got swag";
        let bioIndex = 0;
        let isDeleting = false;
        function typeBio() {
            if (!isDeleting && bioIndex < bioText.length) {
                bioElement.textContent = bioText.substring(0, bioIndex + 1);
                bioIndex++;
                setTimeout(typeBio, 100);
            } else if (!isDeleting && bioText.length === bioIndex) {
                setTimeout(() => { isDeleting = true; typeBio(); }, 2000);
            } else if (isDeleting && bioIndex > 0) {
                bioElement.textContent = bioText.substring(0, bioIndex - 1);
                bioIndex--;
                setTimeout(typeBio, 50);
            } else if (isDeleting && bioIndex === 0) {
                isDeleting = false;
                setTimeout(typeBio, 500);
            }
        }
        setTimeout(typeBio, 800);

        let targetX = 0, targetY = 0, currentX = 0, currentY = 0, isHovering = false;
        card.addEventListener('mouseenter', () => isHovering = true);
        card.addEventListener('mouseleave', () => { isHovering = false; targetX = targetY = 0; });
        card.addEventListener('mousemove', e => {
            if (!isHovering) return;
            const rect = card.getBoundingClientRect();
            targetX = (e.clientX - rect.left - rect.width / 2) / 10;
            targetY = (e.clientY - rect.top - rect.height / 2) / 10;
        });
        function animate() {
            currentX += (targetX - currentX) * 0.2;
            currentY += (targetY - currentY) * 0.2;
            card.style.transform = `perspective(1000px) rotateY(${currentX}deg) rotateX(${-currentY}deg)`;
            requestAnimationFrame(animate);
        }
        animate();

        document.getElementById('avatar').addEventListener('click', () => {
            document.getElementById('avatar').style.transform = 'scale(1.15) rotate(360deg)';
            setTimeout(() => document.getElementById('avatar').style.transform = '', 600);
        });

        document.getElementById('settingsBtn').addEventListener('click', () => alert('Settings under revamp'));

        let title = "@districtmargi", i = 0, forward = true;
        setInterval(() => {
            document.title = title.substring(0, forward ? ++i : --i);
            if (i > title.length) forward = false;
            if (i < 1) forward = true;
        }, 150);
    </script>
</body>
</html>
