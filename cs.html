<script>
function stripJS(src) {
  src = src.replace(/\{\/\*[\s\S]*?\*\/\}/g, '');

  let out = '';
  let i = 0;
  const len = src.length;

  while (i < len) {
    const ch = src[i];

    if (ch === "'") {
      let s = ch; i++;
      while (i < len) {
        const c = src[i]; s += c; i++;
        if (c === '\\') { s += src[i]; i++; }
        else if (c === "'") break;
      }
      out += s; continue;
    }

    if (ch === '"') {
      let s = ch; i++;
      while (i < len) {
        const c = src[i]; s += c; i++;
        if (c === '\\') { s += src[i]; i++; }
        else if (c === '"') break;
      }
      out += s; continue;
    }

    if (ch === '`') {
      let s = ch; i++;
      let depth = 0;
      while (i < len) {
        const c = src[i]; s += c; i++;
        if (c === '\\') { s += src[i]; i++; }
        else if (c === '$' && src[i] === '{') { s += src[i]; i++; depth++; }
        else if (c === '}' && depth > 0) depth--;
        else if (c === '`' && depth === 0) break;
      }
      out += s; continue;
    }

    if (ch === '/' && src[i + 1] === '/') {
      while (i < len && src[i] !== '\n') i++;
      continue;
    }

    if (ch === '/' && src[i + 1] === '*') {
      i += 2;
      while (i < len - 1 && !(src[i] === '*' && src[i + 1] === '/')) i++;
      i += 2;
      continue;
    }

    if (ch === '/') {
      const prev = out.trimEnd();
      const lastChar = prev[prev.length - 1];
      const isRegex = !lastChar || /[=(:,![&|?{};]/.test(lastChar) || /\b(return|typeof|instanceof|in|of|new|delete|throw|case)\b/.test(prev.slice(-10));
      if (isRegex) {
        let s = ch; i++;
        while (i < len) {
          const c = src[i]; s += c; i++;
          if (c === '\\') { s += src[i]; i++; }
          else if (c === '[') {
            while (i < len && src[i] !== ']') { s += src[i]; i++; }
          }
          else if (c === '/') {
            while (i < len && /[gimsuy]/.test(src[i])) { s += src[i]; i++; }
            break;
          }
        }
        out += s; continue;
      }
    }

    out += ch; i++;
  }

  return out;
}

function stripHTML(src) {
  return src.replace(/<!--[\s\S]*?-->/g, '');
}

function cleanBlankLines(src) {
  return src
    .split('\n')
    .map(l => l.trimEnd())
    .reduce((acc, line) => {
      if (line.trim() === '' && acc[acc.length - 1]?.trim() === '') return acc;
      acc.push(line);
      return acc;
    }, [])
    .join('\n')
    .trim();
}

function strip() {
  const input = document.getElementById('input').value;
  if (!input.trim()) {
    setStatus('nothing to strip.', 'err');
    return;
  }

  try {
    const isHTML = /<[a-z][\s\S]*>/i.test(input);
    let result = input;

    if (isHTML) {
      result = stripHTML(result);
      result = result.replace(/(<script[\s\S]*?>)([\s\S]*?)(<\/script>)/gi, (_, open, js, close) => {
        return open + stripJS(js) + close;
      });
      result = result.replace(/(<style[\s\S]*?>)([\s\S]*?)(<\/style>)/gi, (_, open, css, close) => {
        return open + css.replace(/\/\*[\s\S]*?\*\//g, '') + close;
      });
    } else {
      result = stripJS(result);
    }

    result = cleanBlankLines(result);
    document.getElementById('output').value = result;

    const inLines = input.split('\n').length;
    const outLines = result.split('\n').length;
    setStatus(`✓ done — ${inLines} → ${outLines} lines (removed ${inLines - outLines})`, 'ok');
  } catch (e) {
    setStatus('error: ' + e.message, 'err');
  }
}

function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
}

function copyOutput() {
  const out = document.getElementById('output').value;
  if (!out) return setStatus('nothing to copy.', 'err');
  navigator.clipboard.writeText(out).then(() => {
    setStatus('✓ copied to clipboard', 'ok');
    setTimeout(() => setStatus('', ''), 2000);
  });
}

function clearAll() {
  document.getElementById('input').value = '';
  document.getElementById('output').value = '';
  setStatus('', '');
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') strip();
});
</script>
