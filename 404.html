  if (typeof str !== 'string') return '';
  return str

    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#x27;')

    .replace(/`/g, '&#x60;')

}

function sanitizeUrl(url) {

  // Only allow http, https, mailto
  if (!/^https?:\/\//i.test(url) && !/^mailto:/i.test(url)) return '';
  return url;
}

      const blob = (() => {
        const v = profile.custom_settings;
        if (!v) return {};
        if (typeof v === 'object') return v;
        try { return JSON.parse(v); } catch { return {}; }
      })();
      const get = (key) => {
        if (blob[key] !== undefined && blob[key] !== null) return blob[key];
        if (profile[key] !== undefined && profile[key] !== null) return profile[key];
        return CS_DEF[key];
      };
      return {
        bg_type: get('bg_type'),
        bg_image_url: get('bg_image_url'),
        bg_opacity: get('bg_opacity'),
        bg_color: get('bg_color'),
        bg_grad1: get('bg_grad1'),
        bg_grad2: get('bg_grad2'),
        bg_grad_dir: get('bg_grad_dir'),
        show_video_bg: get('show_video_bg'),
        mute_video: get('mute_video'),
        card_font: get('card_font'),
        accent_color: get('accent_color'),
        card_blur: get('card_blur'),
        card_opacity: get('card_opacity'),
        card_glow: get('card_glow'),
        card_rounded: get('card_rounded'),
        show_uid_scramble: get('show_uid_scramble'),
        youtube_video_id: get('youtube_video_id') || profile.youtube_video_id || '',
        custom_font_name: blob.custom_font_name || null,
        custom_font_family: blob.custom_font_family || null,
        custom_font_data: blob.custom_font_data || null,
        custom_icons: blob.custom_icons || [],
      };
    }

    function guessIcon(label) {
      const map = {
        discord:'fab fa-discord', youtube:'fab fa-youtube', twitter:'fab fa-twitter', x:'fab fa-x-twitter',
        instagram:'fab fa-instagram', tiktok:'fab fa-tiktok', roblox:'fas fa-gamepad', twitch:'fab fa-twitch',
        github:'fab fa-github', spotify:'fab fa-spotify', 'guns.lol':'fas fa-crosshairs', steam:'fab fa-steam',
        reddit:'fab fa-reddit', telegram:'fab fa-telegram', music:'fas fa-music', website:'fas fa-globe',
        link:'fas fa-link', email:'fas fa-envelope'
      };
      return map[(label||'').toLowerCase()] || 'fas fa-link';
    }

    function getHandleFromPath() {
      const path = window.location.pathname;
      return path.replace(/^\//, '').replace(/^@/, '').split('/')[0].toLowerCase();
    }

    const handle = getHandleFromPath();
    window._handle = handle;
    if (!handle) { window.location.href = '/'; }
    document.getElementById('loadHandle').textContent = '@' + handle;

    (function() {
      const bar = document.getElementById('topBar');
      const trigger = document.getElementById('topBarTrigger');
      let hideTimer;
      function showBar() {
        bar.classList.add('visible');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => bar.classList.remove('visible'), 2400);
      }
      trigger.addEventListener('mouseenter', showBar);
      bar.addEventListener('mouseenter', () => clearTimeout(hideTimer));
      bar.addEventListener('mouseleave', () => {
        hideTimer = setTimeout(() => bar.classList.remove('visible'), 700);
      });
      window._showTopBarBriefly = () => { showBar(); };
    })();

    let ytPlayer = null;
    let ytApiReady = false;

    // Load YouTube IFrame API
    function loadYouTubeIframeAPI() {
      if (window.YT && window.YT.Player) {
        ytApiReady = true;
        return;
      }
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      const firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    }

    window.onYouTubeIframeAPIReady = function() {
      ytApiReady = true;
    };

    // FIX: Create YouTube background using the IFrame API properly
    function createYouTubeBackground(videoId, shouldMute, audioOnly = false) {
 if (!videoId) return;
  const container = document.getElementById('ytBg');
  if (!container) return;
      
if (audioOnly) {
    container.style.opacity = '0';
    container.style.pointerEvents = 'none';
  }
      // Clean up old player
      if (ytPlayer) {
        try { ytPlayer.destroy(); } catch (e) {}
        ytPlayer = null;
      }
      const old = document.getElementById('yt-player');
      if (old) old.remove();

      const playerDiv = document.createElement('div');
      playerDiv.id = 'yt-player';
      container.appendChild(playerDiv);

      function initWhenReady() {
        if (!ytApiReady || !window.YT || !window.YT.Player) {
          setTimeout(initWhenReady, 120);
          return;
        }

        ytPlayer = new YT.Player('yt-player', {
          height: '100%',
          width: '100%',
          videoId: videoId,
          playerVars: {
            autoplay: 1,
            controls: 0,
            mute: 1,          // always start muted — browsers require this for autoplay
            loop: 1,
            playlist: videoId,
            modestbranding: 1,
            playsinline: 1,
            disablekb: 1,
            fs: 0,
            iv_load_policy: 3,
            cc_load_policy: 0,
            rel: 0,
            showinfo: 0,
            autohide: 1,
            start: 0,
            origin: window.location.origin,
          },
          events: {
            onReady: (event) => {
              event.target.mute();
              event.target.playVideo();
              // show the background once the player is ready
              container.classList.add('active');
            },
            onStateChange: (event) => {
              if (event.data === YT.PlayerState.PLAYING) {
                // unmute after playback starts if the profile allows it
                if (!shouldMute) {
                  try { event.target.unMute(); event.target.setVolume(60); } catch(e) {}
                }
              }
              // loop: restart on end or unexpected pause
              if (
                event.data === YT.PlayerState.ENDED ||
                event.data === YT.PlayerState.UNSTARTED
              ) {
                try { event.target.seekTo(0); event.target.playVideo(); } catch(e) {}
              }
            },
            onError: (event) => {
              console.warn("YouTube background error:", event.data);
              container.classList.remove('active');
            }
          }
        });
      }

      initWhenReady();
    }

    loadYouTubeIframeAPI();

    async function loadProfile() {
      const { data: profile, error } = await sb.from('profiles').select('*').eq('handle', handle).single();
      if (error || !profile) {
        document.getElementById('loading').classList.add('out');
        setTimeout(() => {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('nfSub').textContent = `@${handle} hasn't been claimed yet.`;
          document.getElementById('notFound').classList.add('visible');
        }, 600);
        return;
      }

      const CS = buildCS(profile);

      if (CS.custom_font_data && CS.custom_font_family) {
        const style = document.createElement('style');
        style.textContent = `@font-face { font-family: '${CS.custom_font_family}'; src: url('${CS.custom_font_data}'); }`;
        document.head.appendChild(style);
      }

      applyCardStyles(CS);

      const avatarEl = document.getElementById('cardAvatar');
      if (profile.avatar_url) {
  // Validate avatar URL before injecting
  const safeAvatar = sanitizeUrl(profile.avatar_url);
  if (safeAvatar) {
    avatarEl.innerHTML = `<img src="${safeAvatar}" alt="">`;
  }
}

      const nameEl = document.getElementById('cardName');
      nameEl.textContent = profile.display_name || profile.handle;
      nameEl.style.background = 'none';
      nameEl.style.webkitTextFillColor = CS.accent_color;
      nameEl.style.color = CS.accent_color;

      document.getElementById('cardHandle').textContent = '@' + profile.handle;
      document.getElementById('topBarHandle').textContent = '@' + profile.handle;
      document.getElementById('footerVersion').textContent = `swaqq.xyz/@${profile.handle}`;
      document.title = `${profile.display_name || profile.handle} — swaqq.xyz`;

      sb.from('profiles').select('id').order('created_at', { ascending: true }).then(({ data: allIds }) => {
        if (!allIds) return;
        const pos = allIds.findIndex(r => r.id === profile.id);
        const uidEl = document.getElementById('uidVal');
        const num = pos !== -1 ? pos + 1 : '?';
        if (CS.show_uid_scramble) {
          startUidScramble(num);
        } else {
          uidEl.textContent = num;
        }
      });

      const badgesEl = document.getElementById('cardBadges');
      const rawBadges = Array.isArray(profile.badges) ? profile.badges : (() => {
        try { return JSON.parse(profile.badges || '[]'); } catch { return []; }
      })();
      if (rawBadges.length > 0) {
        badgesEl.style.display = 'inline-flex';
        rawBadges.forEach(badgeId => {
          const def = BADGE_DEFS.find(b => b.id === badgeId);
          if (!def) return;
          const div = document.createElement('div');
          div.className = 'badge';
          div.innerHTML = `<i class="${def.icon}"></i><div class="badge-tip">${def.label}</div>`;
          badgesEl.appendChild(div);
        });
      }

      const socialsEl = document.getElementById('cardSocials');
      const rawSocials = Array.isArray(profile.socials) ? profile.socials : (() => {
        try { return JSON.parse(profile.socials || '[]'); } catch { return []; }
      })();

rawSocials.forEach(s => {
  if (!s.url) return;
  const safeUrl = sanitizeUrl(s.url); 
  if (!safeUrl) return; 
  const a = document.createElement('a');
  a.className = 'social-btn nav-link';
  a.dataset.href = safeUrl;
  
  let iconHtml;
  if (s.icon_type === 'custom' && s.icon_data) {
    
    if (/^data:image\/(png|jpeg|gif|webp|svg\+xml);base64,/i.test(s.icon_data)) {
      iconHtml = `<img src="${s.icon_data}" alt="">`;
    } else {
      iconHtml = `<i class="fas fa-link"></i>`;
    }
  } else if (s.icon) {

    const safeIcon = /^fa[bsrl]? fa-[\w-]+$/.test(s.icon) ? s.icon : 'fas fa-link';
    iconHtml = `<i class="${safeIcon}"></i>`;
  } else {
    iconHtml = `<i class="${guessIcon(s.label)}"></i>`;
  }
  
  const labelSpan = document.createElement('span');
  labelSpan.textContent = s.label || '';
  a.innerHTML = iconHtml + ' ';
  a.appendChild(labelSpan);
  socialsEl.appendChild(a);
});

      if (profile.discord_id) {
        document.getElementById('discordStatus').classList.add('visible');
        fetchDiscordStatus(profile.discord_id);
      }

      if (profile.show_splash !== false) {
        renderSplash(profile, CS);
      } else {
        revealProfile(profile, CS);
      }

      if (profile.show_views !== false) {
        countView(profile.id, profile.handle);
      }
    }
    // Block banned users
if (profile.is_banned) {
  document.getElementById('loading').classList.add('out');
  setTimeout(() => document.getElementById('loading').style.display = 'none', 600);
  document.getElementById('notFound').classList.add('visible');
  document.getElementById('nfSub').textContent = 'this profile has been suspended.';
  return;
}
    function applyCardStyles(CS) {
      const card = document.getElementById('card');
      const accent = CS.accent_color || '#ffffff';
      const blur = CS.card_blur ?? 12;
      const op = CS.card_opacity ?? 85;
      const glow = CS.card_glow !== false;
      const rounded = CS.card_rounded !== false;
      const font = CS.card_font || 'Syne';
      const alpha = Math.round(op * 2.55).toString(16).padStart(2, '0');

      card.style.background = '#111111' + alpha;
      card.style.backdropFilter = `blur(${blur}px)`;
      card.style.webkitBackdropFilter = `blur(${blur}px)`;
      card.style.borderRadius = rounded ? '20px' : '4px';
      card.style.fontFamily = `'${font}', sans-serif`;

      if (glow) {
        card.style.boxShadow = `0 0 40px ${accent}22, 0 0 80px ${accent}0a`;
      }

      document.getElementById('cardBio').style.fontFamily = `'${font}', monospace`;
      document.getElementById('cardHandle').style.fontFamily = `'${font}', monospace`;

      const bgType = CS.bg_type || 'video';

      if (bgType === 'image' && CS.bg_image_url) {
        const imgBg = document.getElementById('imgBg');
        imgBg.style.backgroundImage = `url(${CS.bg_image_url})`;
        imgBg.style.opacity = (CS.bg_opacity ?? 70) / 100;
        imgBg.classList.add('visible');
      } else if (bgType === 'color' && CS.bg_color) {
        document.body.style.background = CS.bg_color;
      } else if (bgType === 'gradient') {
        document.body.style.background = `linear-gradient(${CS.bg_grad_dir || 'to bottom right'}, ${CS.bg_grad1 || '#0a0a1a'}, ${CS.bg_grad2 || '#1a0a0a'})`;
      }
    }

    function renderSplash(profile, CS) {
      const splashEl = document.getElementById('splash');
      const splashName = document.getElementById('splashName');
      splashEl.classList.add('active');
      document.getElementById('loading').classList.add('out');
      setTimeout(() => document.getElementById('loading').style.display = 'none', 600);
      const name = profile.display_name || profile.handle;
      let i = 0;
      function type() {
        if (i <= name.length) {
          splashName.textContent = name.slice(0, i++);
          setTimeout(type, 110);
        }
      }
      setTimeout(type, 200);
      splashEl.addEventListener('click', () => {
        splashEl.classList.add('out');
        setTimeout(() => {
          splashEl.style.display = 'none';
          revealProfile(profile, CS);
        }, 900);
      }, { once: true });
    }

    function revealProfile(profile, CS) {
      document.getElementById('loading').classList.add('out');
      setTimeout(() => document.getElementById('loading').style.display = 'none', 600);
      document.getElementById('profilePage').classList.add('visible');
      document.getElementById('card').classList.add('loaded');
      if (profile.show_views !== false) document.getElementById('views').classList.add('visible');
      window._showTopBarBriefly && window._showTopBarBriefly();

      // FIX: check bg_type, show_video_bg, AND that a video ID actually exists
      const videoId = CS.youtube_video_id || profile.youtube_video_id;
const audioId = CS.audio_only_id || '';

if (CS.bg_type === 'audio' && audioId) {
  // Audio only — hidden iframe, no visual
  createYouTubeBackground(audioId, CS.mute_audio !== false, true);
} else if (CS.bg_type === 'video' && videoId && CS.show_video_bg !== false) {
  createYouTubeBackground(videoId, CS.mute_video !== false, false);
}

      typeBio(profile.bio || '');
      _profileIdForReactions = profile.id;
initReactions(profile.id);
      if (profile.show_tilt !== false) initTilt();
      initNavLinks();
      updateClock();
      setInterval(updateClock, 1000);
    }

    function updateClock() {
      const now = new Date();
      let h = now.getHours(), m = String(now.getMinutes()).padStart(2,'0'), s = String(now.getSeconds()).padStart(2,'0');
      const ap = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      document.getElementById('footerClock').textContent = `${String(h).padStart(2,'0')}:${m}:${s} ${ap}`;
    }

    async function fetchDiscordStatus(discordId) {
      try {
        const r = await fetch(`https://api.lanyard.rest/v1/users/${discordId}`);
        const d = await r.json();
        if (d.success && d.data) {
          const { discord_status: st, activities } = d.data;
          document.getElementById('statusDot').className = 'status-dot ' + (st || 'offline');
          const custom = activities?.find(a => a.type === 4);
          document.getElementById('statusText').textContent =
            (st && st !== 'offline' && custom?.state) ? custom.state : (st || 'offline');
        }
      } catch(_) {}
    }

    const scrambleChars = '0123456789ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛟ⚡☠✦✧⚔◊◈△▽';

    function startUidScramble(realNum) {
      const el = document.getElementById('uidVal');
      const len = String(realNum).length;
      let count = 0;
      const iv = setInterval(() => {
        let s = '';
        for (let i = 0; i < len; i++) s += scrambleChars[Math.floor(Math.random() * scrambleChars.length)];
        el.textContent = s;
        if (++count > 36) { clearInterval(iv); el.textContent = realNum; }
      }, 55);
    }

    function typeBio(text) {
      const bioEl = document.getElementById('cardBio');
      if (!text) { bioEl.innerHTML = ''; return; }
      let idx = 0, deleting = false;
      function tick() {
        bioEl.innerHTML = text.slice(0, idx) + '<span class="bio-cursor"></span>';
        if (!deleting) {
          if (idx < text.length) { idx++; setTimeout(tick, 90); }
          else { deleting = true; setTimeout(tick, 2200); }
        } else {
          if (idx > 0) { idx--; setTimeout(tick, 45); }
          else { deleting = false; setTimeout(tick, 500); }
        }
      }
      setTimeout(tick, 400);
    }

    function initTilt() {
      const card = document.getElementById('card');
      let tx=0, ty=0, cx=0, cy=0, hovering=false;
      card.addEventListener('mouseenter', () => hovering = true);
      card.addEventListener('mouseleave', () => { hovering = false; tx = ty = 0; });
      card.addEventListener('mousemove', e => {
        if (!hovering) return;
        const r = card.getBoundingClientRect();
        tx = (e.clientX - r.left - r.width / 2) / 12;
        ty = (e.clientY - r.top - r.height / 2) / 12;
      });
      function anim() {
        cx += (tx - cx) * 0.18; cy += (ty - cy) * 0.18;
        card.style.transform = `perspective(1200px) rotateY(${cx}deg) rotateX(${-cy}deg)`;
        requestAnimationFrame(anim);
      }
      anim();
      document.getElementById('cardAvatar').addEventListener('click', () => {
        const av = document.getElementById('cardAvatar');
        av.style.transition = 'transform 0.6s cubic-bezier(0.34,1.56,0.64,1)';
        av.style.transform = 'scale(1.15) rotate(360deg)';
        setTimeout(() => { av.style.transform = ''; }, 620);
      });
    }

    function initNavLinks() {
      const overlay = document.getElementById('navOverlay');
      let pending = '';
      document.querySelectorAll('.nav-link').forEach(el => {
        el.addEventListener('click', e => {
          e.preventDefault();
          pending = el.dataset.href;
          document.getElementById('navUrl').textContent = pending;
          overlay.classList.add('active');
        });
      });
      document.getElementById('navYes').addEventListener('click', () => {
        overlay.classList.remove('active');
        if (pending) window.open(pending, '_blank');
        pending = '';
      });
      document.getElementById('navNo').addEventListener('click', () => {
        overlay.classList.remove('active'); pending = '';
      });
      overlay.addEventListener('click', e => {
        if (e.target === overlay) { overlay.classList.remove('active'); pending = ''; }
      });
    }

    async function countView(profileId, profileHandle) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d'); ctx.fillText('fp', 0, 0);
      const fp = { ua:navigator.userAgent, lang:navigator.language, res:`${screen.width}x${screen.height}`, tz:Intl.DateTimeFormat().resolvedOptions().timeZone, cv:canvas.toDataURL() };
      let hash = 0; const str = JSON.stringify(fp);
      for (let i = 0; i < str.length; i++) { hash = ((hash << 5) - hash) + str.charCodeAt(i); hash |= 0; }
      const key = `sv_${profileHandle}_${Math.abs(hash).toString(36)}`;
      const today = new Date().toDateString();
      const stored = JSON.parse(localStorage.getItem(key) || '{"c":0,"d":""}');
      if (stored.d !== today) stored.c = 0;
      if (stored.c < 2) {
        stored.c++; stored.d = today; localStorage.setItem(key, JSON.stringify(stored));
        await sb.rpc('increment_views', { profile_id: profileId }).catch(() => {});
      }
      const { data } = await sb.from('profiles').select('view_count').eq('id', profileId).single();
      document.getElementById('viewCount').textContent = (data?.view_count || 0).toLocaleString();
    }
    // ── LIKES / DISLIKES ──────────────────────────────────────────────────────────
async function initReactions(profileId) {
  const { data } = await sb.from('profiles')
    .select('like_count, dislike_count')
    .eq('id', profileId).single();
  
  if (data) {
    document.getElementById('likeCount').textContent = data.like_count || 0;
    document.getElementById('dislikeCount').textContent = data.dislike_count || 0;
  }
  
  // Check if user already reacted (localStorage per profile)
  const reacted = localStorage.getItem(`swaqq_react_${profileId}`);
  if (reacted === 'like') {
    document.getElementById('likeBtn').style.color = '#43b581';
    document.getElementById('likeBtn').style.borderColor = 'rgba(67,181,129,0.3)';
  } else if (reacted === 'dislike') {
    document.getElementById('dislikeBtn').style.color = '#f04747';
    document.getElementById('dislikeBtn').style.borderColor = 'rgba(240,71,71,0.3)';
  }
}

let _profileIdForReactions = null;

async function handleReaction(type) {
  if (!_profileIdForReactions) return;
  const key = `swaqq_react_${_profileIdForReactions}`;
  const existing = localStorage.getItem(key);
  if (existing) return; // already reacted — one per visitor
  
  localStorage.setItem(key, type);
  
  await sb.rpc('toggle_like', { 
    profile_id: _profileIdForReactions, 
    action: type 
  }).catch(() => {
    // fallback direct update
    const col = type === 'like' ? 'like_count' : 'dislike_count';
    sb.from('profiles')
      .update({ [col]: sb.rpc('increment', { x: 1 }) })
      .eq('id', _profileIdForReactions);
  });
  
  // Update UI
  const btn = document.getElementById(type === 'like' ? 'likeBtn' : 'dislikeBtn');
  const countEl = document.getElementById(type === 'like' ? 'likeCount' : 'dislikeCount');
  const cur = parseInt(countEl.textContent) || 0;
  countEl.textContent = cur + 1;
  btn.style.color = type === 'like' ? '#43b581' : '#f04747';
  btn.style.borderColor = type === 'like' ? 'rgba(67,181,129,0.3)' : 'rgba(240,71,71,0.3)';
  
  // Animate
  btn.style.transform = 'scale(1.2)';
  setTimeout(() => btn.style.transform = '', 300);
}
    loadProfile();
